<style>
:root {

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

.hidden { display: none !important; }

      '<div class="two"><label class="f">Glucides<input type="number" inputmode="decimal" id="p-gluc" value="' + esc(e.gluc == null ? '' : e.gluc) + '" placeholder="g"></label><label class="f">Lipides<input type="number" inputmode="decimal" id="p-lip" value="' + esc(e.lip == null ? '' : e.lip) + '" placeholder="g"></label></div>' +
      '<div class="sub">Ingrédients</div>' + e.ing.map(function (g, i) {
        return '<div class="ing"><input type="text" data-ing="nom" data-i="' + i + '" value="' + esc(g.nom) + '" placeholder="Ingrédient"><input type="number" inputmode="decimal" data-ing="qty" data-i="' + i + '" value="' + esc(g.qty) + '" placeholder="Qté"><select data-ing="unit" data-i="' + i + '">' + ['g', 'ml', 'unité'].map(function (u) { return '<option' + (g.unit === u ? ' selected' : '') + '>' + u + '</option>'; }).join('') + '</select><button class="x" data-a="ingdel" data-i="' + i + '" aria-label="Retirer">✕</button></div>';
      }).join('') + '<button class="add" data-a="ingadd">+ Ingrédient</button><p class="msg">' + esc(msgTxt) + '</p>' +
      '<button class="btn" data-a="psave">Enregistrer</button>' + (edit ? '<button class="btn ghost" data-a="pcancel">Annuler</button>' : '') + '</div></section>';
    h = diagCard() + h;
    h += '<section class="card" style="--ic:#A08CFF"><div class="head"><div class="t"><h2>Mes objectifs</h2><small>Pour les totaux de chaque jour</small></div></div><div class="two"><label class="f">Calories / jour<input type="number" inputmode="numeric" id="g-kcal" value="' + esc(S.goals.kcal) + '"></label><label class="f">Protéines / jour<input type="number" inputmode="numeric" id="g-prot" value="' + esc(S.goals.prot || '') + '" placeholder="g"></label></div></section>';
    h += '<section class="card plain"><div class="head"><div class="t"><h2>Mes plats</h2><small>' + S.plats.length + ' plats</small></div></div>' + SLOTS.map(function (s, si) {
      if (si === 3) return '';
      var items = S.plats.filter(function (p) { return si === 1 ? (p.slots || []).some(function (x) { return x === 1 || x === 3; }) && !(p.slots || []).some(function (x) { return x === 0 || x === 2 || x === 4; }) : (p.slots || []).indexOf(si) >= 0 && !(si === 4 && (p.slots || []).indexOf(2) >= 0); });
      if (!items.length) return '';
      return '<div class="sub">' + (si === 1 ? 'Collations' : si === 2 ? 'Déjeuner / dîner' : s[0]) + '</div>' + items.map(platCard).join('');
    }).join('') + S.plats.filter(function (p) { return !p.slots || !p.slots.length; }).map(platCard).join('') + '</section>';
    return h;
  }

  /* Pack d'idées : valeurs moyennes indicatives, à ajuster. */

  /* Remplace la bibliothèque par la liste d'aliments à combiner (les menus déjà faits restent affichés tels quels). */
  function addPack() {
    S.plats = PACK.map(function (x, i) { var o = JSON.parse(JSON.stringify(x)); o.id = 'b' + i + Date.now().toString(36); o.fixe = o.mode === 'fixe'; return o; });
    save(); return S.plats.length;
  }
  /* Bilan de la bibliothèque : ce qui empêche la génération de tomber juste ou de varier. */
  function diagCard() {
    var out = [], gk = S.goals.kcal || 1950, gp = S.goals.prot || 0;
    var wk = S.weeks[wkKey()] || {}, places = { 0: 0, 24: 0 };
    dates(offset).forEach(function (d) { var di = iso(d); [0, 2, 4].forEach(function (si) { var x = (wk[di] || {})[si]; if (!x || !x.etat || x.etat === 'repas') places[si === 0 ? 0 : 24]++; }); });
    function cap(test) { return S.plats.filter(function (p) { return p.kcal && prole(p) === 'principal' && (p.slots || []).some(test); }).reduce(function (n, p) { return n + (p.max || 99); }, 0); }
    var hasCombo = S.plats.some(function (p) { return prole(p) === 'proteine'; }) && S.plats.some(function (p) { return prole(p) === 'feculent'; });
    var cMain = hasCombo ? 999 : cap(function (x) { return x === 2 || x === 4; }), cBk = cap(function (x) { return x === 0; });
    var nMain = hasCombo ? S.plats.filter(function (p) { return prole(p) === 'proteine'; }).length * S.plats.filter(function (p) { return prole(p) === 'feculent'; }).length : S.plats.filter(function (p) { return p.kcal && prole(p) === 'principal' && (p.slots || []).some(function (x) { return x === 2 || x === 4; }); }).length;
    if (places[24]) {
      if (cMain < places[24]) out.push(['bad', 'Déjeuners et dîners : ' + (cMain >= 99 ? 'plats illimités' : cMain + ' repas possibles') + ' pour ' + places[24] + ' places cette semaine. Augmente les « max par semaine » ou ajoute des plats principaux.']);
      else if (nMain < 6) out.push(['warn', 'Seulement ' + nMain + ' plats principaux pour le midi et le soir : attends-toi à des répétitions. 6 à 8 plats donnent une semaine variée.']);
      else out.push(['good', (hasCombo ? nMain + ' assiettes protéine + féculent possibles' : nMain + ' plats principaux') + ' pour le midi et le soir : assez pour varier.']);
    }
    if (places[0] && cBk < 99 && cBk < places[0]) out.push(['bad', 'Petit-déjeuner : ' + cBk + ' possibles pour ' + places[0] + ' jours.']);
    var adj = S.plats.filter(function (p) { return p.kcal && p.prot && pmode(p) !== 'fixe'; });
    var bestAdj = adj.reduce(function (m, p) { var dn = p.prot / p.kcal * 100; return !m || dn > m.dn ? { p: p, dn: dn } : m; }, null);
    if (gp) {
      if (!bestAdj || bestAdj.dn < 10) out.push(['bad', 'Aucun aliment ajustable vraiment protéiné' + (bestAdj ? ' (le meilleur : ' + esc(bestAdj.p.nom) + ', ' + fmtQ(bestAdj.dn) + ' g/100 kcal)' : '') + '. Passe le skyr, le fromage blanc ou un shaker en portion « Décimale » pour que l\'app puisse viser ' + gp + ' g.']);
      else if (adj.filter(function (p) { return p.prot / p.kcal * 100 >= 10; }).length < 2) out.push(['warn', 'Un seul levier protéiné ajustable (' + esc(bestAdj.p.nom) + ') : il va revenir souvent. Ajoute-en un 2ᵉ (shaker, thon, blanc de poulet, cottage cheese…) en portion Décimale.']);
      else out.push(['good', 'Levier protéines : ' + esc(bestAdj.p.nom) + ' (' + fmtQ(bestAdj.dn) + ' g de protéines pour 100 kcal), ajustable.']);
      var fixHigh = S.plats.filter(function (p) { return p.kcal && p.prot && pmode(p) === 'fixe' && prole(p) === 'complement' && p.prot / p.kcal * 100 >= 10; });
      if (fixHigh.length) out.push(['warn', fixHigh.map(function (p) { return esc(p.nom); }).join(', ') + ' : très protéiné mais en portion fixe. En « Décimale », l\'app pourrait mieux doser.']);
    }
    S.plats.filter(function (p) { return p.kcal && p.prot != null && prole(p) === 'principal' && p.prot / p.kcal * 100 < 5; }).forEach(function (p) {
      out.push(['warn', esc(p.nom) + ' : ' + fmtN(p.prot) + ' g de protéines pour ' + fmtN(p.kcal) + ' kcal, c\'est peu. Vérifie le chiffre.']);
    });
    var noK = S.plats.filter(function (p) { return !p.kcal; });
    if (noK.length) out.push(['warn', noK.map(function (p) { return esc(p.nom); }).join(', ') + ' : pas de calories, donc jamais utilisé par la génération.']);
    S.plats.filter(function (p) { return p.kcal > gk * 0.5; }).forEach(function (p) { out.push(['warn', esc(p.nom) + ' : ' + fmtN(p.kcal) + ' kcal, plus de la moitié de ta journée. Il ne pourra sortir que les jours très légers à côté.']); });
    var bad = out.filter(function (x) { return x[0] !== 'good'; }).length;
    return '<section class="card ' + (diagOpen ? 'open' : '') + '" style="--ic:' + (bad ? '#FF6B8B' : '#5BD893') + '"><div class="head" data-a="diag"><div class="t"><h2>Bilan de ma bibliothèque</h2><small>' + (bad ? plural(bad, 'point') + ' à améliorer pour des menus justes et variés' : 'Tout est prêt pour bien générer') + '</small></div><span class="pill ' + (bad ? 'bad' : 'good') + '">' + (bad ? bad + ' ⚠️' : '✓') + '</span><span class="chev"></span></div>' +
      '<div class="body"><button class="btn gold" data-a="pack">' + (pendingPack ? 'Confirmer : remplacer mes plats' : '⟳ Charger mes aliments à combiner') + '</button><span class="muted" style="font-size:12.5px;margin-top:-4px">Œuf coque, egg muffin, poulet, saumon, riz, pâtes, boulgour, quinoa, lentilles quinoa, patate douce, courgettes, wrap, skyr, fromage blanc, fruits, amandes. Remplace ta liste actuelle.</span>' + out.map(function (x) { return '<div class="plat" style="flex-direction:row;gap:8px;align-items:flex-start"><span>' + (x[0] === 'good' ? '✅' : x[0] === 'bad' ? '🔴' : '🟠') + '</span><span style="font-size:14px">' + x[1] + '</span></div>'; }).join('') + '</div></section>';
  }
  function platCard(p) {
    return '<div class="plat"><b>' + esc(p.nom) + '</b><span class="muted">' + [p.kcal ? fmtN(p.kcal) + ' kcal' + (isGr(p) ? ' /100 g' : '') : '', p.prot ? 'P ' + fmtQ(p.prot) + ' · G ' + fmtQ(p.gluc || 0) + ' · L ' + fmtQ(p.lip || 0) : '', ({ principal: 'plat complet', complement: 'complément', proteine: 'protéine', feculent: 'féculent', legume: 'légume' })[prole(p)], (p.maxJour > 1 ? 'max ' + p.maxJour + '×/jour' : ''), p.max ? 'max ' + p.max + '×/sem.' : '', ({ fixe: 'portion fixe', entier: 'portion entière', decimal: 'portion décimale' })[pmode(p)]].filter(Boolean).join(' · ') + '</span>' +
      '<span class="muted" style="font-size:12.5px">' + ((p.ing || []).map(function (g) { return fmtQ(g.qty) + ' ' + g.unit + ' ' + esc(g.nom); }).join(' · ') || 'Aucun ingrédient') + '</span>' +
      '<div class="btns"><button data-a="pedit" data-id="' + p.id + '">✏️ Modifier</button><button class="del" data-a="pdel" data-id="' + p.id + '">' + (pendingDel === p.id ? 'Confirmer ✕' : '✕ Supprimer') + '</button></div></div>';
  }
  function readForm() {
    if (!edit) edit = { nom: '', slots: [], role: 'principal', mode: 'fixe', kcal: '', prot: '', ing: [] };
    var n = $('#p-nom'); if (!n) return;
    edit.nom = n.value; edit.max = $('#p-max').value; edit.maxJour = $('#p-maxj').value; edit.kcal = $('#p-kcal').value; edit.prot = $('#p-prot').value; edit.gluc = $('#p-gluc').value; edit.lip = $('#p-lip').value;
    edit.ing = [].map.call(document.querySelectorAll('.ing'), function (r) { return { nom: r.querySelector('[data-ing=nom]').value, qty: r.querySelector('[data-ing=qty]').value, unit: r.querySelector('[data-ing=unit]').value }; });
  }

  /* ---------- rendu ---------- */
  function render() {
    var ds = dates(offset);
    $('#wk').textContent = ds[0].toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + ' – ' + ds[6].toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
    $('#nav').classList.toggle('hidden', view === 'plats');
    $('#title').textContent = view === 'semaine' ? 'Menus' : view === 'resume' ? 'Résumé' : view === 'courses' ? 'Courses' : 'Plats';
    $('#eyebrow').textContent = view === 'resume' ? 'Ce que je mange' : view === 'semaine' ? 'Mes repas · 5 prises' : view === 'courses' ? 'Semaine affichée' : 'Ma bibliothèque';
    [].forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.setAttribute('aria-selected', b.dataset.v === view); });
    main.innerHTML = view === 'resume' ? resumeView() : view === 'semaine' ? semaine() : view === 'courses' ? coursesView() : platsView();
  }
  function copyText(t, b) { try { navigator.clipboard.writeText(t); b.textContent = 'Copié ✔'; } catch (e) { b.textContent = 'Copie impossible'; } }

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-a]'); if (!b) return;
    var a = b.dataset.a, di = b.dataset.di, si = +b.dataset.si;
    if (a !== 'gen') msgTxt = '';
    if (a === 'tab') { view = b.dataset.v; edit = null; window.scrollTo(0, 0); }
    else if (a === 'prev') offset--;
    else if (a === 'next') offset++;
    else if (a === 'today') offset = 0;
    else if (a === 'day') { var cur = openDays[di] != null ? openDays[di] : di === iso(new Date()); openDays[di] = !cur; }
    else if (a === 'etat') setSlot(di, si, { etat: b.dataset.v });
    else if (a === 'addline') { var ls = (slot(di, si).lines || []).slice(); ls.push({ pid: '', mult: 1 }); setSlot(di, si, { lines: ls }); }
    else if (a === 'delline') { var ls2 = (slot(di, si).lines || []).filter(function (_, j) { return j !== +b.dataset.li; }); setSlot(di, si, { lines: ls2 }); }
    else if (a === 'alldays') {
      var key = di + '|' + si;
      if (pendingAll !== key) { pendingAll = key; setTimeout(function () { if (pendingAll === key) { pendingAll = null; render(); } }, 4000); }
      else {
        pendingAll = null;
        var src = (slot(di, si).lines || []).filter(function (l) { return plat(l.pid); }).map(function (l) { return { pid: l.pid, mult: l.mult || 1 }; });
        dates(offset).forEach(function (d) { var x = iso(d); if (x !== di) setSlot(x, si, { etat: 'repas', lines: JSON.parse(JSON.stringify(src)) }); });
        msgTxt = '';
      }
    }
    else if (a === 'diag') diagOpen = !diagOpen;
    else if (a === 'pack') { if (!pendingPack) { pendingPack = true; setTimeout(function () { pendingPack = false; render(); }, 4000); } else { pendingPack = false; addPack(); } }
    else if (a === 'gen') generer();
    else if (a === 'copy') {
      var ds = dates(offset), L = ['Menus — semaine du ' + $('#wk').textContent, ''];
      ds.forEach(function (d, i) { var x = iso(d), t = dayTotals(x); L.push(DAYS[i] + (t.n ? ' (' + fmtN(t.kcal) + ' kcal · ' + fmtN(t.prot) + ' g prot.)' : '')); SLOTS.forEach(function (s, j) { var n = slotNames(x, j); if (n !== '—') L.push('  ' + s[0] + ' : ' + n); }); });
      copyText(L.join('\n'), b); return;
    }
    else if (a === 'clear') {
      if (!pendingClear) { pendingClear = true; setTimeout(function () { pendingClear = false; render(); }, 4000); }
      else { pendingClear = false; delete S.weeks[wkKey()]; delete S.checked[wkKey()]; save(); }
    }
    else if (a === 'check') { var ck = S.checked[wkKey()] = S.checked[wkKey()] || {}; if (ck[b.dataset.k]) delete ck[b.dataset.k]; else ck[b.dataset.k] = 1; save(); }
    else if (a === 'copyc') { var ck2 = S.checked[wkKey()] || {}; copyText(courses().filter(function (g) { return !ck2[g.k]; }).map(function (g) { return '• ' + g.nom + ' : ' + fmtQ(g.qty) + ' ' + g.unit; }).join('\n'), b); return; }
    else if (a === 'pslot') { readForm(); var k = edit.slots.indexOf(si); if (k >= 0) edit.slots.splice(k, 1); else edit.slots.push(si); edit.slots.sort(); }
    else if (a === 'prole') { readForm(); edit.role = b.dataset.v; }
    else if (a === 'pmode') { readForm(); edit.mode = b.dataset.v; }
    else if (a === 'ingadd') { readForm(); edit.ing.push({ nom: '', qty: '', unit: 'g' }); }
    else if (a === 'ingdel') { readForm(); edit.ing.splice(+b.dataset.i, 1); }
    else if (a === 'pcancel') edit = null;
    else if (a === 'psave') {
      readForm();
      if (!edit.nom.trim()) { msgTxt = 'Donne un nom au plat.'; render(); return; }
      if (!edit.slots.length) { msgTxt = 'Choisis au moins une prise.'; render(); return; }
      var obj = { id: edit.id || 'p' + Date.now().toString(36), nom: edit.nom.trim(), slots: edit.slots.slice(), max: num(edit.max) ? Math.max(1, Math.round(num(edit.max))) : null, maxJour: num(edit.maxJour) ? Math.max(1, Math.round(num(edit.maxJour))) : null, role: edit.role || 'principal', mode: edit.mode || 'fixe', fixe: (edit.mode || 'fixe') === 'fixe', kcal: num(edit.kcal), prot: num(edit.prot), gluc: num(edit.gluc), lip: num(edit.lip), ing: edit.ing.filter(function (g) { return g.nom.trim(); }).map(function (g) { return { nom: g.nom.trim(), qty: num(g.qty) || 0, unit: g.unit }; }) };
      var ex = plat(obj.id); if (ex) Object.assign(ex, obj); else S.plats.push(obj);
      edit = null; save();
    }
    else if (a === 'pedit') { var p = plat(b.dataset.id); if (p) { edit = JSON.parse(JSON.stringify(p)); edit.slots = edit.slots || []; edit.mode = pmode(p); edit.role = prole(p); if (!edit.ing.length) edit.ing = [{ nom: '', qty: '', unit: 'g' }]; window.scrollTo(0, 0); } }
    else if (a === 'pdel') {
      var id = b.dataset.id;
      if (pendingDel !== id) { pendingDel = id; setTimeout(function () { if (pendingDel === id) { pendingDel = null; render(); } }, 4000); }
      else { S.plats = S.plats.filter(function (x) { return x.id !== id; }); pendingDel = null; save(); }
    }
    render();
  });
  document.addEventListener('change', function (ev) {
    var el = ev.target, f = el.dataset.f, di = el.dataset.di, si = +el.dataset.si;
    if (el.id === 'g-kcal') { S.goals.kcal = num(el.value) || 1950; save(); return; }
    if (el.id === 'g-prot') { S.goals.prot = num(el.value); save(); return; }
    if (!f) return;
    if (f === 'label') { setSlot(di, si, { label: el.value }); return; }
    if (f === 'dk' || f === 'dp') { var pt = {}; pt[f === 'dk' ? 'kcal' : 'prot'] = num(el.value); setSlot(di, si, pt); render(); return; }
    var ls = (slot(di, si).lines || []).map(function (x) { return Object.assign({}, x); }), li = +el.dataset.li;
    if (!ls[li]) return;
    if (f === 'pid') { ls[li].pid = el.value; var np = plat(el.value); ls[li].mult = isGr(np) ? (np.typ || 100) / 100 : 1; } else if (f === 'grams') ls[li].mult = (num(el.value) || 100) / 100; else ls[li].mult = num(el.value) || 1;
    setSlot(di, si, { lines: ls }); render();
  });
  render();
})();
</script>
</body>

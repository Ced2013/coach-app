<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1A1B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Menus">
<title>Menus Saiyan</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F0EA; --surface: #FFFFFF; --surface-2: #F1EBE2; --ink: #1A1B2E; --muted: #8A8275; --line: #E7DFD3;
  --marine: #1A1B2E; --gold: #C8862A; --gold-2: #E0A04A; --creme: #EAD9BC;
  --good: #2E7D4F; --good-bg: #E2F1E7; --bad: #B23A3A; --bad-bg: #F9E2E2;
  --c0: #FFB347; --c1: #4FD1C0; --c2: #FF8A3D; --c3: #A08CFF; --c4: #3FB6FF;
  --font-display: 'Bebas Neue', 'Oswald', system-ui, sans-serif; --font-body: 'DM Sans', system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { overflow-x: clip; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); min-height: 100vh; padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px)); overflow-x: clip; }
button, input, select { font: inherit; color: inherit; }
input, select { font-size: 16px; }
header { position: relative; padding: calc(18px + env(safe-area-inset-top, 0px)) 0 16px; margin-bottom: 14px; color: var(--creme); }
header::before { content: ''; position: absolute; left: calc(50% - 50vw); right: calc(50% - 50vw); top: 0; bottom: 0; background: var(--marine); z-index: -1; }
.eyebrow { color: var(--gold); font: 700 11px var(--font-body); letter-spacing: .16em; text-transform: uppercase; }
h1 { font: 400 34px/1.05 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--creme); margin-top: 4px; }
.nav { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.nav button { min-height: 40px; min-width: 44px; border-radius: 10px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: var(--creme); font-weight: 600; }
.nav .wk { flex: 1; text-align: center; font-size: 14px; color: #CFC3AE; }
.nav .today { font: 400 15px var(--font-display); letter-spacing: .08em; padding: 0 12px; }
main { display: flex; flex-direction: column; gap: 12px; }
.card { --ic: #C8B9A3; background: linear-gradient(160deg, color-mix(in srgb, var(--ic) 26%, #fff) 0%, color-mix(in srgb, var(--ic) 10%, #fff) 100%); border-left: 5px solid var(--ic); border-radius: 16px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(26,27,46,.05), 0 6px 18px -10px rgba(26,27,46,.18); display: flex; flex-direction: column; gap: 10px; }
.card.plain { --ic: #C8B9A3; background: #fff; }
.card.dark { background: var(--marine); color: var(--creme); border-left-color: var(--gold); }
.head { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.head .t { flex: 1; min-width: 0; }
.head h2 { font: 700 17px/1.2 var(--font-body); }
.head small { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.chev { width: 9px; height: 9px; border-left: 2px solid var(--muted); border-top: 2px solid var(--muted); transform: rotate(-135deg); margin: -4px 4px 0; flex: none; }
.open > .head .chev { transform: rotate(45deg); margin-top: 6px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.8); color: #A9906B; white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.sub { font: 400 14px/1.2 var(--font-display); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.body { display: none; flex-direction: column; gap: 10px; }
.open > .body { display: flex; }
.today-card { box-shadow: 0 0 0 2px var(--gold), 0 6px 18px -10px rgba(26,27,46,.18); }
.slot { background: rgba(255,255,255,.75); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; border-left: 4px solid var(--sc); }
.slot-top { display: flex; align-items: center; gap: 8px; }
.slot-top b { flex: 1; font-size: 14.5px; }
.slot-top b small { color: var(--muted); font-weight: 500; margin-left: 4px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: #fff; }
.seg button { border: 0; background: none; padding: 5px 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--marine); color: var(--creme); }
.line { display: grid; grid-template-columns: minmax(0,1fr) 3.6em 32px; gap: 6px; align-items: center; }
select, input[type=text], input[type=number] { width: 100%; min-height: 40px; border: 1px solid var(--line); border-radius: 9px; background: #fff; padding: 0 9px; }
input[type=number] { text-align: center; }
.x { min-height: 32px; border: 0; background: none; color: var(--bad); font-size: 18px; }
.add { border: 1.5px dashed #C4B9A5; background: transparent; border-radius: 9px; min-height: 38px; color: var(--gold); font-weight: 600; font-size: 13.5px; }
.muted { color: var(--muted); font-size: 13.5px; }
.btn { min-height: 46px; border: 0; border-radius: 12px; background: var(--marine); color: var(--creme); font: 400 18px var(--font-display); letter-spacing: .08em; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); font: 600 13px var(--font-body); letter-spacing: 0; min-height: 40px; }
.btn.gold { background: linear-gradient(135deg, #FFB347, #FF6A2B); color: #1A0F08; }
.btn.warn { border-color: var(--bad); color: var(--bad); }
.tot { display: flex; gap: 8px; }
.tot div { flex: 1; background: rgba(255,255,255,.08); border-radius: 12px; padding: 8px 10px; }
.tot b { display: block; font: 400 30px/1 var(--font-display); color: var(--gold-2); letter-spacing: .03em; }
.tot span { font-size: 12px; color: #CFC3AE; }
.bar { height: 7px; border-radius: 6px; background: rgba(26,27,46,.08); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); }
.bar.over i { background: var(--bad); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .q { font: 400 17px var(--font-display); color: var(--gold); letter-spacing: .04em; white-space: nowrap; }
.row.done span:first-of-type { text-decoration: line-through; color: var(--muted); }
.chk { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); background: #fff; display: grid; place-items: center; flex: none; color: #fff; font-size: 14px; }
.done .chk { background: var(--good); border-color: var(--good); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 13px; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--marine); color: var(--creme); border-color: var(--marine); }
.ing { display: grid; grid-template-columns: minmax(0,1fr) 4.2em 4.6em 30px; gap: 5px; align-items: center; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.plat { background: rgba(255,255,255,.75); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.plat b { font-size: 15px; }
.plat .btns { display: flex; gap: 6px; margin-top: 4px; }
.plat .btns button { min-height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.plat .btns .del { color: var(--bad); }
.msg { color: var(--bad); font-size: 13px; min-height: 1em; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: var(--marine); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabs button { flex: 1; border: 0; background: none; color: #8E8FA8; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 54px; font: 400 14px var(--font-display); letter-spacing: .08em; }
.tabs button[aria-selected="true"] { color: var(--gold-2); box-shadow: inset 0 3px 0 var(--gold); }
.tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="eyebrow" id="eyebrow">Mes repas · 5 prises</div>
  <h1 id="title">Menus</h1>
  <div class="nav" id="nav">
    <button data-a="prev" aria-label="Semaine précédente">‹</button>
    <span class="wk" id="wk">—</span>
    <button data-a="next" aria-label="Semaine suivante">›</button>
    <button class="today" data-a="today">AUJ.</button>
  </div>
</header>
<main id="main"></main>
<nav class="tabs" role="tablist">
  <button data-a="tab" data-v="semaine" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Semaine</button>
  <button data-a="tab" data-v="courses" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.8L21 8H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>Courses</button>
  <button data-a="tab" data-v="plats" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 3c-1.7 0-3 2.4-3 5.5S14 13 16 13v8"/></svg>Plats</button>
</nav>
<script>
(function () {
  'use strict';
  var SLOTS = [['Petit-déjeuner', '7h30'], ['Collation', '10h30'], ['Déjeuner', '13h'], ['Collation', '16h30'], ['Dîner', '20h']];
  var DAYS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
  var LS = 'menus-saiyan-v1';
  /* Exemples de départ : modifiables ou supprimables dans l'onglet Plats. */
  var SEED = [
    { id: 'e1', nom: 'Skyr, flocons d\'avoine et fruits rouges', slots: [0], kcal: 380, prot: 30, ing: [{ nom: 'skyr', qty: 200, unit: 'g' }, { nom: 'flocons d\'avoine', qty: 40, unit: 'g' }, { nom: 'fruits rouges', qty: 80, unit: 'g' }] },
    { id: 'e2', nom: 'Omelette 3 œufs et pain complet', slots: [0], kcal: 420, prot: 26, ing: [{ nom: 'œufs', qty: 3, unit: 'unité' }, { nom: 'pain complet', qty: 60, unit: 'g' }] },
    { id: 'e3', nom: 'Fromage blanc et amandes', slots: [1, 3], kcal: 220, prot: 18, ing: [{ nom: 'fromage blanc', qty: 150, unit: 'g' }, { nom: 'amandes', qty: 15, unit: 'g' }] },
    { id: 'e4', nom: 'Pomme et barre protéinée', slots: [1, 3], kcal: 280, prot: 20, ing: [{ nom: 'pommes', qty: 1, unit: 'unité' }, { nom: 'barres protéinées', qty: 1, unit: 'unité' }] },
    { id: 'e5', nom: 'Poulet, riz et légumes', slots: [2, 4], kcal: 560, prot: 45, ing: [{ nom: 'poulet', qty: 150, unit: 'g' }, { nom: 'riz', qty: 70, unit: 'g' }, { nom: 'légumes', qty: 200, unit: 'g' }] },
    { id: 'e6', nom: 'Saumon, patate douce et brocoli', slots: [2, 4], kcal: 590, prot: 38, ing: [{ nom: 'saumon', qty: 130, unit: 'g' }, { nom: 'patate douce', qty: 200, unit: 'g' }, { nom: 'brocoli', qty: 150, unit: 'g' }] },
    { id: 'e7', nom: 'Poisson blanc, quinoa et courgettes', slots: [2, 4], kcal: 450, prot: 40, ing: [{ nom: 'poisson blanc', qty: 160, unit: 'g' }, { nom: 'quinoa', qty: 60, unit: 'g' }, { nom: 'courgettes', qty: 200, unit: 'g' }] },
    { id: 'e8', nom: 'Bowl bœuf haché 5 %, haricots rouges', slots: [2, 4], kcal: 540, prot: 42, ing: [{ nom: 'bœuf haché 5 %', qty: 125, unit: 'g' }, { nom: 'haricots rouges', qty: 100, unit: 'g' }, { nom: 'riz', qty: 50, unit: 'g' }, { nom: 'poivrons', qty: 100, unit: 'g' }] }
  ];
  var S = { plats: null, weeks: {}, goals: { kcal: 1950, prot: 150 }, checked: {} };
  try { var raw = JSON.parse(localStorage.getItem(LS) || '{}'); if (raw && typeof raw === 'object') { S.plats = raw.plats || null; S.weeks = raw.weeks || {}; S.goals = Object.assign(S.goals, raw.goals || {}); S.checked = raw.checked || {}; } } catch (e) {}
  if (!S.plats) S.plats = SEED.slice();
  if (S.goals.prot == null) S.goals.prot = 150;
  function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }

  var pendingAll = null, view = 'semaine', offset = 0, openDays = {}, edit = null, pendingDel = null, pendingClear = false, msgTxt = '';
  var main = document.getElementById('main');
  function $(q) { return document.querySelector(q); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function monday(off) { var t = new Date(); t.setHours(0, 0, 0, 0); t.setDate(t.getDate() - ((t.getDay() + 6) % 7) + off * 7); return t; }
  function dates(off) { var m = monday(off); return [0, 1, 2, 3, 4, 5, 6].map(function (i) { var d = new Date(m); d.setDate(m.getDate() + i); return d; }); }
  function wkKey() { return iso(monday(offset)); }
  function plat(id) { return S.plats.filter(function (p) { return p.id === id; })[0]; }
  function num(v) { var n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; }
  function fmtN(n) { return Math.round(n).toLocaleString('fr-FR'); }
  function fmtQ(n) { return (Math.round(n * 10) / 10).toLocaleString('fr-FR'); }

  function slot(di, si) { return ((S.weeks[wkKey()] || {})[di] || {})[si] || { etat: 'repas', lines: [] }; }
  function setSlot(di, si, patch) {
    var w = S.weeks[wkKey()] = S.weeks[wkKey()] || {}; var d = w[di] = w[di] || {};
    d[si] = Object.assign({ etat: 'repas', lines: [] }, d[si] || {}, patch); save();
  }
  function dayTotals(di) {
    var k = 0, p = 0, n = 0;
    SLOTS.forEach(function (_, si) { var s = slot(di, si); if (s.etat === 'dehors') { k += s.kcal || 0; p += s.prot || 0; if (s.kcal) n++; return; } if (s.etat && s.etat !== 'repas') return; (s.lines || []).forEach(function (l) { var pl = plat(l.pid); if (!pl) return; n++; k += (pl.kcal || 0) * (l.mult || 1); p += (pl.prot || 0) * (l.mult || 1); }); });
    return { kcal: k, prot: p, n: n };
  }
  function slotNames(di, si) {
    var s = slot(di, si);
    if (s.etat === 'dehors') return 'Extérieur' + (s.label ? ' · ' + s.label : '');
    if (s.etat === 'saute') return 'Sauté';
    var n = (s.lines || []).map(function (l) { var p = plat(l.pid); return p ? p.nom + (l.mult !== 1 ? ' ×' + fmtQ(l.mult) : '') : null; }).filter(Boolean);
    return n.length ? n.join(', ') : '—';
  }

  /* ---------- Semaine ---------- */
  function slotHtml(di, si) {
    var s = slot(di, si), e = s.etat || 'repas';
    var h = '<div class="slot" style="--sc:var(--c' + si + ')"><div class="slot-top"><b>' + SLOTS[si][0] + '<small>' + SLOTS[si][1] + '</small></b><div class="seg">' +
      [['repas', 'Repas'], ['dehors', 'Dehors'], ['saute', 'Sauté']].map(function (o) { return '<button data-a="etat" data-di="' + di + '" data-si="' + si + '" data-v="' + o[0] + '" aria-pressed="' + (e === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div></div>';
    if (e === 'dehors') return h + '<input type="text" data-f="label" data-di="' + di + '" data-si="' + si + '" placeholder="Ex. resto, repas du boulot…" value="' + esc(s.label || '') + '">' +
      '<div class="two"><input type="number" inputmode="numeric" data-f="dk" data-di="' + di + '" data-si="' + si + '" placeholder="kcal estimées" value="' + (s.kcal || '') + '"><input type="number" inputmode="numeric" data-f="dp" data-di="' + di + '" data-si="' + si + '" placeholder="protéines (g)" value="' + (s.prot || '') + '"></div>' +
      '<span class="muted" style="font-size:12.5px">Une estimation aide la génération à équilibrer le reste de la journée.</span></div>';
    if (e === 'saute') return h + '</div>';
    h += (s.lines || []).map(function (l, li) {
      var opts = S.plats.filter(function (p) { return !p.slots || !p.slots.length || p.slots.indexOf(si) >= 0 || p.id === l.pid; });
      return '<div class="line"><select data-f="pid" data-di="' + di + '" data-si="' + si + '" data-li="' + li + '"><option value="">— choisir —</option>' +
        opts.map(function (p) { return '<option value="' + p.id + '"' + (p.id === l.pid ? ' selected' : '') + '>' + esc(p.nom) + '</option>'; }).join('') + '</select>' +
        '<input type="number" step="0.25" min="0.25" inputmode="decimal" title="Portion" data-f="mult" data-di="' + di + '" data-si="' + si + '" data-li="' + li + '" value="' + (l.mult || 1) + '">' +
        '<button class="x" data-a="delline" data-di="' + di + '" data-si="' + si + '" data-li="' + li + '" aria-label="Retirer">✕</button></div>';
    }).join('');
    var has = (s.lines || []).some(function (l) { return plat(l.pid); });
    return h + '<div class="two"><button class="add" data-a="addline" data-di="' + di + '" data-si="' + si + '">+ Ajouter un plat</button>' +
      (has ? '<button class="add" style="border-style:solid" data-a="alldays" data-di="' + di + '" data-si="' + si + '">' + (pendingAll === di + '|' + si ? 'Confirmer ?' : '⧉ Tous les jours') + '</button>' : '') + '</div></div>';
  }
  function semaine() {
    var ds = dates(offset), today = iso(new Date()), h = '';
    var wk = { k: 0, p: 0, n: 0 };
    ds.forEach(function (d) { var t = dayTotals(iso(d)); if (t.n) { wk.k += t.kcal; wk.p += t.prot; wk.n++; } });
    h += '<section class="card dark"><div class="sub" style="color:#CFC3AE">Moyenne des jours planifiés</div><div class="tot"><div><b>' + (wk.n ? fmtN(wk.k / wk.n) : '–') + '</b><span>kcal / jour · objectif ' + fmtN(S.goals.kcal) + '</span></div><div><b>' + (wk.n ? fmtN(wk.p / wk.n) + ' g' : '–') + '</b><span>protéines / jour' + (S.goals.prot ? ' · objectif ' + S.goals.prot + ' g' : '') + '</span></div></div></section>';
    h += '<button class="btn gold" data-a="gen">✨ Générer les repas manquants</button>';
    h += '<p class="msg" style="text-align:center">' + esc(msgTxt) + '</p>';
    ds.forEach(function (d, i) {
      var di = iso(d), t = dayTotals(di), open = openDays[di] != null ? openDays[di] : di === today;
      var over = t.kcal > S.goals.kcal * 1.05, okD = Math.abs(t.kcal - S.goals.kcal) <= S.goals.kcal * 0.05 && (!S.goals.prot || t.prot >= S.goals.prot * 0.9), pc = Math.min(100, Math.round(t.kcal / S.goals.kcal * 100));
      h += '<section class="card ' + (open ? 'open' : '') + (di === today ? ' today-card' : '') + '" style="--ic:var(--c' + (i % 5) + ')"><div class="head" data-a="day" data-di="' + di + '"><div class="t"><h2>' + DAYS[i] + ' ' + d.getDate() + '/' + (d.getMonth() + 1) + '</h2>' +
        '<small>' + SLOTS.map(function (sl, si) { return slotNames(di, si); }).filter(function (x) { return x !== '—'; }).slice(0, 3).join(' · ') + '</small></div>' +
        (t.n ? '<span class="pill ' + (okD ? 'good' : over ? 'bad' : '') + '">' + fmtN(t.kcal) + ' kcal · ' + fmtN(t.prot) + ' g</span>' : '<span class="pill">À planifier</span>') + '<span class="chev"></span></div>' +
        '<div class="body">' + (t.n ? '<div class="bar' + (over ? ' over' : '') + '"><i style="width:' + pc + '%"></i></div>' : '') + SLOTS.map(function (_, si) { return slotHtml(di, si); }).join('') + '</div></section>';
    });
    h += '<button class="btn ghost" data-a="copy">Copier le menu en texte</button>';
    h += '<button class="btn ghost warn" data-a="clear">' + (pendingClear ? 'Confirmer : vider la semaine' : '↺ Vider la semaine') + '</button>';
    return h;
  }
  /* Génération : pour chaque jour, on cherche la combinaison de plats et de portions
     la plus proche de l'objectif kcal ET protéines, en tenant compte de ce qui est déjà rempli. */
  var MULTS = [0.75, 1, 1.25, 1.5, 2];
  function generer() {
    var ds = dates(offset), used = {}, added = 0, gk = S.goals.kcal || 1950, gp = S.goals.prot || 0;
    ds.forEach(function (d) { SLOTS.forEach(function (_, si) { (slot(iso(d), si).lines || []).forEach(function (l) { used[l.pid] = (used[l.pid] || 0) + 1; }); }); });
    var report = [];
    ds.forEach(function (d) {
      var di = iso(d), base = dayTotals(di), empty = [];
      SLOTS.forEach(function (_, si) {
        var s = slot(di, si); if (s.etat && s.etat !== 'repas') return;
        if ((s.lines || []).some(function (l) { return plat(l.pid); })) return;
        var ok = S.plats.filter(function (p) { return (!p.slots || !p.slots.length || p.slots.indexOf(si) >= 0) && p.kcal; });
        if (ok.length) empty.push({ si: si, ok: ok });
      });
      if (!empty.length) return;
      var best = null;
      for (var t = 0; t < 4000; t++) {
        var k = base.kcal, p = base.prot, pick = [], pen = 0, seen = {};
        empty.forEach(function (e) {
          var pl = e.ok[Math.floor(Math.random() * e.ok.length)], m = MULTS[Math.floor(Math.random() * MULTS.length)];
          if (e.si === 1 || e.si === 3) m = Math.min(m, 1.5);
          k += pl.kcal * m; p += (pl.prot || 0) * m; pick.push({ si: e.si, pid: pl.id, mult: m });
          pen += (used[pl.id] || 0) * 0.015 + (seen[pl.id] ? 0.04 : 0) + Math.abs(m - 1) * 0.01; seen[pl.id] = 1;
        });
        var sc = Math.abs(k - gk) / gk + (gp ? Math.abs(p - gp) / gp : 0) + pen;
        if (!best || sc < best.sc) best = { sc: sc, pick: pick, k: k, p: p };
      }
      best.pick.forEach(function (x) { used[x.pid] = (used[x.pid] || 0) + 1; setSlot(di, x.si, { lines: [{ pid: x.pid, mult: x.mult }] }); added++; });
      report.push(Math.round(best.k));
    });
    msgTxt = added ? '' : 'Rien à générer : toutes les prises « Repas » ont un plat (avec ses calories).';
  }
  /* ---------- Courses ---------- */
  function courses() {
    var tot = {};
    dates(offset).forEach(function (d) {
      var di = iso(d);
      SLOTS.forEach(function (_, si) {
        var s = slot(di, si); if (s.etat && s.etat !== 'repas') return;
        (s.lines || []).forEach(function (l) { var p = plat(l.pid); if (!p) return; (p.ing || []).forEach(function (g) { var k = g.nom.toLowerCase() + '|' + g.unit; tot[k] = tot[k] || { k: k, nom: g.nom, unit: g.unit, qty: 0 }; tot[k].qty += (g.qty || 0) * (l.mult || 1); }); });
      });
    });
    return Object.keys(tot).map(function (k) { return tot[k]; }).sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); });
  }
  function coursesView() {
    var list = courses(), ck = S.checked[wkKey()] || {}, left = list.filter(function (g) { return !ck[g.k]; }).length;
    var h = '<section class="card" style="--ic:#4FD1C0"><div class="head"><div class="t"><h2>Liste de la semaine</h2><small>Calculée depuis tes menus · touche pour cocher</small></div><span class="pill ' + (list.length && !left ? 'good' : '') + '">' + (list.length - left) + '/' + list.length + '</span></div>';
    h += list.length ? '<div>' + list.map(function (g) { return '<div class="row' + (ck[g.k] ? ' done' : '') + '" data-a="check" data-k="' + esc(g.k) + '"><span class="chk">' + (ck[g.k] ? '✓' : '') + '</span><span style="flex:1">' + esc(g.nom) + '</span><span class="q">' + fmtQ(g.qty) + ' ' + g.unit + '</span></div>'; }).join('') + '</div>'
      : '<p class="muted">Aucun ingrédient : choisis des plats dans l\'onglet Semaine.</p>';
    h += '</section>';
    if (list.length) h += '<button class="btn ghost" data-a="copyc">Copier la liste</button>';
    return h;
  }

  /* ---------- Plats ---------- */
  function platsView() {
    var e = edit || { nom: '', slots: [], kcal: '', prot: '', ing: [{ nom: '', qty: '', unit: 'g' }] };
    var h = '<section class="card open" style="--ic:#FF8A3D"><div class="head"><div class="t"><h2>' + (edit && edit.id ? 'Modifier le plat' : 'Nouveau plat') + '</h2><small>Quantités pour 1 portion</small></div></div><div class="body">' +
      '<label class="f">Nom<input type="text" id="p-nom" value="' + esc(e.nom) + '" placeholder="Ex. Poulet, riz et légumes"></label>' +
      '<div class="sub">Pour quelles prises</div><div class="chips">' + SLOTS.map(function (s, si) { return '<button class="chip" data-a="pslot" data-si="' + si + '" aria-pressed="' + (e.slots.indexOf(si) >= 0) + '">' + s[0] + (si === 1 || si === 3 ? ' ' + s[1] : '') + '</button>'; }).join('') + '</div>' +
      '<div class="two"><label class="f">Calories / portion<input type="number" inputmode="numeric" id="p-kcal" value="' + esc(e.kcal) + '" placeholder="kcal"></label><label class="f">Protéines / portion<input type="number" inputmode="numeric" id="p-prot" value="' + esc(e.prot) + '" placeholder="g"></label></div>' +
      '<div class="sub">Ingrédients</div>' + e.ing.map(function (g, i) {
        return '<div class="ing"><input type="text" data-ing="nom" data-i="' + i + '" value="' + esc(g.nom) + '" placeholder="Ingrédient"><input type="number" inputmode="decimal" data-ing="qty" data-i="' + i + '" value="' + esc(g.qty) + '" placeholder="Qté"><select data-ing="unit" data-i="' + i + '">' + ['g', 'ml', 'unité'].map(function (u) { return '<option' + (g.unit === u ? ' selected' : '') + '>' + u + '</option>'; }).join('') + '</select><button class="x" data-a="ingdel" data-i="' + i + '" aria-label="Retirer">✕</button></div>';
      }).join('') + '<button class="add" data-a="ingadd">+ Ingrédient</button><p class="msg">' + esc(msgTxt) + '</p>' +
      '<button class="btn" data-a="psave">Enregistrer</button>' + (edit ? '<button class="btn ghost" data-a="pcancel">Annuler</button>' : '') + '</div></section>';
    h += '<section class="card" style="--ic:#A08CFF"><div class="head"><div class="t"><h2>Mes objectifs</h2><small>Pour les totaux de chaque jour</small></div></div><div class="two"><label class="f">Calories / jour<input type="number" inputmode="numeric" id="g-kcal" value="' + esc(S.goals.kcal) + '"></label><label class="f">Protéines / jour<input type="number" inputmode="numeric" id="g-prot" value="' + esc(S.goals.prot || '') + '" placeholder="g"></label></div></section>';
    h += '<section class="card plain"><div class="head"><div class="t"><h2>Mes plats</h2><small>' + S.plats.length + ' plats</small></div></div>' + SLOTS.map(function (s, si) {
      if (si === 3) return '';
      var items = S.plats.filter(function (p) { return si === 1 ? (p.slots || []).some(function (x) { return x === 1 || x === 3; }) && !(p.slots || []).some(function (x) { return x === 0 || x === 2 || x === 4; }) : (p.slots || []).indexOf(si) >= 0 && !(si === 4 && (p.slots || []).indexOf(2) >= 0); });
      if (!items.length) return '';
      return '<div class="sub">' + (si === 1 ? 'Collations' : si === 2 ? 'Déjeuner / dîner' : s[0]) + '</div>' + items.map(platCard).join('');
    }).join('') + S.plats.filter(function (p) { return !p.slots || !p.slots.length; }).map(platCard).join('') + '</section>';
    return h;
  }
  function platCard(p) {
    return '<div class="plat"><b>' + esc(p.nom) + '</b><span class="muted">' + [p.kcal ? fmtN(p.kcal) + ' kcal' : '', p.prot ? fmtN(p.prot) + ' g prot.' : ''].filter(Boolean).join(' · ') + '</span>' +
      '<span class="muted" style="font-size:12.5px">' + ((p.ing || []).map(function (g) { return fmtQ(g.qty) + ' ' + g.unit + ' ' + esc(g.nom); }).join(' · ') || 'Aucun ingrédient') + '</span>' +
      '<div class="btns"><button data-a="pedit" data-id="' + p.id + '">✏️ Modifier</button><button class="del" data-a="pdel" data-id="' + p.id + '">' + (pendingDel === p.id ? 'Confirmer ✕' : '✕ Supprimer') + '</button></div></div>';
  }
  function readForm() {
    if (!edit) edit = { nom: '', slots: [], kcal: '', prot: '', ing: [] };
    var n = $('#p-nom'); if (!n) return;
    edit.nom = n.value; edit.kcal = $('#p-kcal').value; edit.prot = $('#p-prot').value;
    edit.ing = [].map.call(document.querySelectorAll('.ing'), function (r) { return { nom: r.querySelector('[data-ing=nom]').value, qty: r.querySelector('[data-ing=qty]').value, unit: r.querySelector('[data-ing=unit]').value }; });
  }

  /* ---------- rendu ---------- */
  function render() {
    var ds = dates(offset);
    $('#wk').textContent = ds[0].toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + ' – ' + ds[6].toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
    $('#nav').classList.toggle('hidden', view === 'plats');
    $('#title').textContent = view === 'semaine' ? 'Menus' : view === 'courses' ? 'Courses' : 'Plats';
    $('#eyebrow').textContent = view === 'semaine' ? 'Mes repas · 5 prises' : view === 'courses' ? 'Semaine affichée' : 'Ma bibliothèque';
    [].forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.setAttribute('aria-selected', b.dataset.v === view); });
    main.innerHTML = view === 'semaine' ? semaine() : view === 'courses' ? coursesView() : platsView();
  }
  function copyText(t, b) { try { navigator.clipboard.writeText(t); b.textContent = 'Copié ✔'; } catch (e) { b.textContent = 'Copie impossible'; } }

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-a]'); if (!b) return;
    var a = b.dataset.a, di = b.dataset.di, si = +b.dataset.si;
    if (a !== 'gen') msgTxt = '';
    if (a === 'tab') { view = b.dataset.v; edit = null; window.scrollTo(0, 0); }
    else if (a === 'prev') offset--;
    else if (a === 'next') offset++;
    else if (a === 'today') offset = 0;
    else if (a === 'day') { var cur = openDays[di] != null ? openDays[di] : di === iso(new Date()); openDays[di] = !cur; }
    else if (a === 'etat') setSlot(di, si, { etat: b.dataset.v });
    else if (a === 'addline') { var ls = (slot(di, si).lines || []).slice(); ls.push({ pid: '', mult: 1 }); setSlot(di, si, { lines: ls }); }
    else if (a === 'delline') { var ls2 = (slot(di, si).lines || []).filter(function (_, j) { return j !== +b.dataset.li; }); setSlot(di, si, { lines: ls2 }); }
    else if (a === 'alldays') {
      var key = di + '|' + si;
      if (pendingAll !== key) { pendingAll = key; setTimeout(function () { if (pendingAll === key) { pendingAll = null; render(); } }, 4000); }
      else {
        pendingAll = null;
        var src = (slot(di, si).lines || []).filter(function (l) { return plat(l.pid); }).map(function (l) { return { pid: l.pid, mult: l.mult || 1 }; });
        dates(offset).forEach(function (d) { var x = iso(d); if (x !== di) setSlot(x, si, { etat: 'repas', lines: JSON.parse(JSON.stringify(src)) }); });
        msgTxt = '';
      }
    }
    else if (a === 'gen') generer();
    else if (a === 'copy') {
      var ds = dates(offset), L = ['Menus — semaine du ' + $('#wk').textContent, ''];
      ds.forEach(function (d, i) { var x = iso(d), t = dayTotals(x); L.push(DAYS[i] + (t.n ? ' (' + fmtN(t.kcal) + ' kcal · ' + fmtN(t.prot) + ' g prot.)' : '')); SLOTS.forEach(function (s, j) { var n = slotNames(x, j); if (n !== '—') L.push('  ' + s[0] + ' : ' + n); }); });
      copyText(L.join('\n'), b); return;
    }
    else if (a === 'clear') {
      if (!pendingClear) { pendingClear = true; setTimeout(function () { pendingClear = false; render(); }, 4000); }
      else { pendingClear = false; delete S.weeks[wkKey()]; delete S.checked[wkKey()]; save(); }
    }
    else if (a === 'check') { var ck = S.checked[wkKey()] = S.checked[wkKey()] || {}; if (ck[b.dataset.k]) delete ck[b.dataset.k]; else ck[b.dataset.k] = 1; save(); }
    else if (a === 'copyc') { var ck2 = S.checked[wkKey()] || {}; copyText(courses().filter(function (g) { return !ck2[g.k]; }).map(function (g) { return '• ' + g.nom + ' : ' + fmtQ(g.qty) + ' ' + g.unit; }).join('\n'), b); return; }
    else if (a === 'pslot') { readForm(); var k = edit.slots.indexOf(si); if (k >= 0) edit.slots.splice(k, 1); else edit.slots.push(si); edit.slots.sort(); }
    else if (a === 'ingadd') { readForm(); edit.ing.push({ nom: '', qty: '', unit: 'g' }); }
    else if (a === 'ingdel') { readForm(); edit.ing.splice(+b.dataset.i, 1); }
    else if (a === 'pcancel') edit = null;
    else if (a === 'psave') {
      readForm();
      if (!edit.nom.trim()) { msgTxt = 'Donne un nom au plat.'; render(); return; }
      if (!edit.slots.length) { msgTxt = 'Choisis au moins une prise.'; render(); return; }
      var obj = { id: edit.id || 'p' + Date.now().toString(36), nom: edit.nom.trim(), slots: edit.slots.slice(), kcal: num(edit.kcal), prot: num(edit.prot), ing: edit.ing.filter(function (g) { return g.nom.trim(); }).map(function (g) { return { nom: g.nom.trim(), qty: num(g.qty) || 0, unit: g.unit }; }) };
      var ex = plat(obj.id); if (ex) Object.assign(ex, obj); else S.plats.push(obj);
      edit = null; save();
    }
    else if (a === 'pedit') { var p = plat(b.dataset.id); if (p) { edit = JSON.parse(JSON.stringify(p)); edit.slots = edit.slots || []; if (!edit.ing.length) edit.ing = [{ nom: '', qty: '', unit: 'g' }]; window.scrollTo(0, 0); } }
    else if (a === 'pdel') {
      var id = b.dataset.id;
      if (pendingDel !== id) { pendingDel = id; setTimeout(function () { if (pendingDel === id) { pendingDel = null; render(); } }, 4000); }
      else { S.plats = S.plats.filter(function (x) { return x.id !== id; }); pendingDel = null; save(); }
    }
    render();
  });
  document.addEventListener('change', function (ev) {
    var el = ev.target, f = el.dataset.f, di = el.dataset.di, si = +el.dataset.si;
    if (el.id === 'g-kcal') { S.goals.kcal = num(el.value) || 1950; save(); return; }
    if (el.id === 'g-prot') { S.goals.prot = num(el.value); save(); return; }
    if (!f) return;
    if (f === 'label') { setSlot(di, si, { label: el.value }); return; }
    if (f === 'dk' || f === 'dp') { var pt = {}; pt[f === 'dk' ? 'kcal' : 'prot'] = num(el.value); setSlot(di, si, pt); render(); return; }
    var ls = (slot(di, si).lines || []).map(function (x) { return Object.assign({}, x); }), li = +el.dataset.li;
    if (!ls[li]) return;
    if (f === 'pid') ls[li].pid = el.value; else ls[li].mult = num(el.value) || 1;
    setSlot(di, si, { lines: ls }); render();
  });
  render();
})();
</script>
</body>
</html>

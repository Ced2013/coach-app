<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1A1B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Missions">
<link rel="manifest" href="missions.webmanifest">
<link rel="apple-touch-icon" href="missions-180.png">
<link rel="icon" type="image/png" href="missions-192.png">
<title>Missions</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F0EA; --surface: #FFFFFF; --ink: #1A1B2E; --muted: #8A8275; --line: #E7DFD3;
  --marine: #1A1B2E; --gold: #C8862A; --gold-2: #E0A04A; --creme: #EAD9BC;
  --good: #2E7D4F; --good-bg: #E2F1E7; --bad: #B23A3A; --bad-bg: #F9E2E2;
  --font-display: 'Bebas Neue', 'Oswald', system-ui, sans-serif; --font-body: 'DM Sans', system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { overflow-x: clip; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); min-height: 100vh; padding: 0 16px calc(100px + env(safe-area-inset-bottom, 0px)); overflow-x: clip; }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { font-size: 16px; }
header { position: relative; padding: calc(18px + env(safe-area-inset-top, 0px)) 0 18px; color: var(--creme); }
header::before { content: ''; position: absolute; left: calc(50% - 50vw); right: calc(50% - 50vw); top: 0; bottom: 0; background: var(--marine); z-index: -1; }
.eyebrow { color: var(--gold); font: 700 11px var(--font-body); letter-spacing: .16em; text-transform: uppercase; }
.hrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font: 400 36px/1.02 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--creme); margin-top: 4px; }
.ring { width: 58px; height: 58px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 400 19px var(--font-display); letter-spacing: .04em; color: var(--creme); }
.hsub { color: #CFC3AE; font-size: 13.5px; margin-top: 6px; }
.add { position: sticky; top: 0; z-index: 5; margin: 0 -16px 12px; padding: 10px 16px; background: var(--bg); }
.add form { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; min-height: 48px; border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 0 14px; box-shadow: 0 4px 14px -10px rgba(26,27,46,.35); }
.add input:focus { outline: 2px solid var(--gold); outline-offset: 0; }
.add button { width: 48px; min-height: 48px; border: 0; border-radius: 14px; background: var(--gold); color: var(--marine); font-size: 26px; font-weight: 700; line-height: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 0; }
.chip { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: var(--muted); }
.chip.hot { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.chip.ok { background: var(--good-bg); color: var(--good); border-color: transparent; }
main { display: flex; flex-direction: column; gap: 12px; }
.card { --ic: #C8B9A3; background: linear-gradient(160deg, color-mix(in srgb, var(--ic) 22%, #fff) 0%, color-mix(in srgb, var(--ic) 8%, #fff) 100%); border-left: 5px solid var(--ic); border-radius: 18px; padding: 14px 14px 10px; box-shadow: 0 6px 18px -12px rgba(26,27,46,.25); }
.card h2 { font: 400 20px/1.1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.card h2 .n { margin-left: auto; font: 600 12.5px var(--font-body); letter-spacing: 0; text-transform: none; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.8); color: #A9906B; }
.card.late { --ic: #E0605C; } .card.today { --ic: #E0A04A; } .card.star { --ic: #A08CFF; } .card.later { --ic: #4FD1C0; } .card.nodate { --ic: #C8B9A3; } .card.done { --ic: #7BBF8E; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0 8px; }
.task { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-top: 1px solid rgba(26,27,46,.07); }
.task:first-of-type { border-top: 0; }
.ck { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--lc, var(--gold)); background: #fff; display: grid; place-items: center; margin-top: 1px; }
.ck svg { width: 15px; height: 15px; opacity: 0; transition: opacity .15s; }
.task.is-done .ck { background: var(--lc, var(--gold)); } .task.is-done .ck svg { opacity: 1; }
.task.is-done .tt { text-decoration: line-through; color: var(--muted); }
.task .body { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; }
.tt { font-weight: 600; font-size: 15.5px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 3px; font-size: 12.5px; color: var(--muted); align-items: center; }
.meta .late { color: var(--bad); font-weight: 700; }
.meta .dot { display: inline-flex; align-items: center; gap: 5px; } .meta .dot i { width: 8px; height: 8px; border-radius: 50%; background: var(--lc); display: inline-block; }
.star-b { flex: none; border: 0; background: none; font-size: 20px; line-height: 1; padding: 3px 2px; color: #D7CDBE; }
.star-b.on { color: var(--gold); }
.more { border: 0; background: none; color: var(--gold); font-weight: 700; font-size: 13.5px; padding: 6px 0 4px; }
.lists { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lcard { --ic: #C8B9A3; text-align: left; border: 0; border-left: 5px solid var(--ic); border-radius: 16px; padding: 14px; background: linear-gradient(160deg, color-mix(in srgb, var(--ic) 26%, #fff) 0%, color-mix(in srgb, var(--ic) 10%, #fff) 100%); box-shadow: 0 6px 18px -12px rgba(26,27,46,.25); }
.lcard b { display: block; font: 400 20px var(--font-display); letter-spacing: .08em; text-transform: uppercase; }
.lcard small { color: var(--muted); font-size: 13px; }
.lcard.add-l { --ic: var(--line); display: grid; place-items: center; color: var(--muted); font-weight: 600; min-height: 76px; }
.back { border: 0; background: none; color: var(--gold); font-weight: 700; padding: 4px 0; align-self: flex-start; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--marine); display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
nav.tabs button { border: 0; background: none; color: #8D8AA3; display: flex; flex-direction: column; align-items: center; gap: 3px; font: 400 14px var(--font-display); letter-spacing: .08em; padding: 6px 0; border-radius: 12px; position: relative; }
nav.tabs button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-selected="true"] { color: var(--gold-2); }
nav.tabs button[aria-selected="true"]::before { content: ''; position: absolute; top: -8px; left: 18%; right: 18%; height: 3px; border-radius: 0 0 4px 4px; background: var(--gold); }
nav.tabs .badge { position: absolute; top: 2px; right: calc(50% - 22px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font: 700 11px/18px var(--font-body); }
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(10,10,24,.45); display: flex; align-items: flex-end; animation: fade .18s ease; }
.sheet { width: 100%; max-height: 92vh; overflow: auto; background: var(--bg); border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; animation: up .22s ease; }
.sheet h3 { font: 400 22px var(--font-display); letter-spacing: .08em; text-transform: uppercase; }
.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); }
.f input, .f select, .f textarea { min-height: 44px; border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 8px 12px; color: var(--ink); font-weight: 500; width: 100%; }
.f textarea { min-height: 80px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 0; font-weight: 700; background: #F1E6D4; color: #8F6122; }
.btn.main { background: var(--gold); color: var(--marine); flex: 1; }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches button { width: 32px; height: 32px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--marine); color: var(--creme); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; font-size: 14px; animation: up .2s ease; }
.toast button { margin-left: auto; border: 0; background: none; color: var(--gold-2); font-weight: 700; }
.sync { text-align: center; color: var(--muted); font-size: 12.5px; padding: 8px 0; }
.tip { font-size: 13px; color: var(--muted); line-height: 1.5; }
@keyframes fade { from { opacity: 0; } } @keyframes up { from { transform: translateY(24px); opacity: 0; } }
@keyframes pop { 50% { transform: scale(1.18); } }
.task.just .ck { animation: pop .3s ease; }
</style>
</head>
<body>
<header>
  <div class="eyebrow" id="eyebrow">Missions du jour</div>
  <div class="hrow"><div><h1 id="title">Aujourd'hui</h1><div class="hsub" id="hsub"></div></div>
    <div class="ring" id="ring" aria-hidden="true"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" stroke="rgba(255,255,255,.14)" stroke-width="4" fill="none"/><circle id="ring-arc" cx="18" cy="18" r="15.5" stroke="#E0A04A" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="0 100" pathLength="100"/></svg><b id="ring-n">0</b></div></div>
</header>
<div class="add">
  <form id="add-form" autocomplete="off"><input id="add-in" type="text" enterkeyhint="done" placeholder="Mission… (demain, 14h, #liste, !)" aria-label="Nouvelle mission"><button type="submit" aria-label="Ajouter">+</button></form>
  <div class="chips" id="chips"></div>
</div>
<main id="main"></main>
<p class="sync" id="sync"></p>
<nav class="tabs" role="tablist">
  <button role="tab" data-v="today" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Aujourd'hui<span class="badge" id="b-today" hidden></span></button>
  <button role="tab" data-v="next" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>À venir</button>
  <button role="tab" data-v="lists" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>Listes</button>
  <button role="tab" data-v="done" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16.5 9.5"/></svg>Fait</button>
</nav>
<script>
(function () {
  'use strict';
  var LS = 'ced-todo-v1', LS_GH = 'ced-routines-gh', GH_PATH = 'missions-data.json';
  var COLORS = ['#E0A04A', '#4FD1C0', '#FF8A3D', '#A08CFF', '#3FB6FF', '#E0605C', '#7BBF8E', '#C8B9A3'];
  var DEFAULT_LISTS = [['l-boulot', 'Boulot', '#3FB6FF'], ['l-maison', 'Maison', '#E0A04A'], ['l-famille', 'Famille', '#FF8A3D'], ['l-perso', 'Perso', '#A08CFF'], ['l-sport', 'Sport', '#4FD1C0'], ['l-courses', 'Courses', '#7BBF8E']];
  var JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  var REC = { none: 'Jamais', day: 'Chaque jour', week: 'Chaque semaine', month: 'Chaque mois', wd: 'Jours de boulot (mar → sam)' };
  var $ = function (q) { return document.querySelector(q); };
  var main = $('#main');
  var view = 'today', openList = null, toastT = null, lastUndo = null;

  /* ---------- dates ---------- */
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { return iso(new Date()); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
  function diff(a, b) { return Math.round((parse(b) - parse(a)) / 864e5); }
  function dLabel(s) {
    var n = diff(today(), s);
    if (n === 0) return "Aujourd'hui"; if (n === 1) return 'Demain'; if (n === -1) return 'Hier';
    if (n > 1 && n < 7) return JOURS[parse(s).getDay()].replace(/^./, function (c) { return c.toUpperCase(); });
    return parse(s).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function uid() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* ---------- données ---------- */
  var S = { tasks: [], lists: [], log: [] };
  try { var raw = JSON.parse(localStorage.getItem(LS) || 'null'); if (raw && Array.isArray(raw.tasks)) S = raw; } catch (e) {}
  if (!Array.isArray(S.lists) || !S.lists.length) S.lists = DEFAULT_LISTS.map(function (l) { return { id: l[0], name: l[1], color: l[2], _u: 1 }; });
  if (!Array.isArray(S.log)) S.log = [];
  function live() { return S.tasks.filter(function (t) { return !t.del; }); }
  function listOf(id) { return S.lists.filter(function (l) { return l.id === id && !l.del; })[0] || null; }
  function lists() { return S.lists.filter(function (l) { return !l.del; }); }
  var saveT = null;
  function save() {
    S.tasks = S.tasks.filter(function (t) { return !(t.del && Date.now() - t._u > 40 * 864e5); });
    S.log = S.log.filter(function (x) { return diff(x.d, today()) <= 60; });
    try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
    clearTimeout(saveT); saveT = setTimeout(ghPush, 8000);
  }
  function touchT(t) { t._u = Date.now(); }

  /* ---------- saisie rapide intelligente ---------- */
  function nextWeekday(w, from) { var d = parse(from || today()), n = (w - d.getDay() + 7) % 7; if (n === 0) n = 7; d.setDate(d.getDate() + n); return iso(d); }
  function smart(txt) {
    var o = { title: txt, date: null, time: null, imp: false, list: null, rec: 'none' }, s = ' ' + txt + ' ', m;
    function cut(re) { s = s.replace(re, ' '); }
    if (/\s!+\s|!+\s*$/.test(s) || /\burgent\b/i.test(s)) { o.imp = true; cut(/\s!+(?=\s)/g); s = s.replace(/!+/g, ''); }
    if ((m = s.match(/#([\wÀ-ÿ-]+)/))) { var q = m[1].toLowerCase(), l = lists().filter(function (x) { return x.name.toLowerCase().indexOf(q) === 0; })[0]; if (l) { o.list = l.id; cut(/#[\wÀ-ÿ-]+/); } }
    if (/\b(tous les jours|chaque jour)\b/i.test(s)) { o.rec = 'day'; cut(/\b(tous les jours|chaque jour)\b/i); if (!o.date) o.date = today(); }
    else if (/\b(chaque|tous les) mois\b/i.test(s)) { o.rec = 'month'; cut(/\b(chaque|tous les) mois\b/i); }
    else if ((m = s.match(/\b(?:chaque|tous les) (lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)s?\b/i))) { o.rec = 'week'; o.date = nextWeekday(JOURS.indexOf(m[1].toLowerCase()), addDays(today(), -1)); cut(m[0]); }
    else if (/\b(chaque|toutes les) semaines?\b/i.test(s)) { o.rec = 'week'; cut(/\b(chaque|toutes les) semaines?\b/i); }
    if ((m = s.match(/\s(?:à\s*)?(\d{1,2})\s*h\s*(\d{2})?(?=\s)/i))) { var hh = +m[1]; if (hh < 24) { o.time = String(hh).padStart(2, '0') + ':' + (m[2] || '00'); cut(m[0]); } }
    if (/\baujourd'?hui\b|\bauj\b|\bce soir\b|\bce midi\b/i.test(s)) { o.date = today(); cut(/\baujourd'?hui\b|\bauj\b/i); }
    else if (/\baprès-?demain\b/i.test(s)) { o.date = addDays(today(), 2); cut(/\baprès-?demain\b/i); }
    else if (/\bdemain\b/i.test(s)) { o.date = addDays(today(), 1); cut(/\bdemain\b/i); }
    else if ((m = s.match(/\bdans (\d+) jours?\b/i))) { o.date = addDays(today(), +m[1]); cut(m[0]); }
    else if (/\bsemaine prochaine\b/i.test(s)) { o.date = nextWeekday(1); cut(/\bsemaine prochaine\b/i); }
    else if (/\bce week-?end\b/i.test(s)) { o.date = nextWeekday(6, addDays(today(), -1)); cut(/\bce week-?end\b/i); }
    else if ((m = s.match(/\b(le )?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))) {
      var y = m[4] ? (+m[4] < 100 ? 2000 + +m[4] : +m[4]) : new Date().getFullYear(), d = new Date(y, +m[3] - 1, +m[2]);
      if (!m[4] && iso(d) < today()) d.setFullYear(y + 1); if (!isNaN(d)) { o.date = iso(d); cut(m[0]); }
    }
    else if ((m = s.match(/\b(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)( prochain)?\b/i)) && o.rec === 'none') { o.date = nextWeekday(JOURS.indexOf(m[1].toLowerCase()), addDays(today(), -1)); cut(m[0]); }
    if (o.time && !o.date) o.date = today();
    o.title = s.replace(/\s(à|le|pour)\s*$/i, ' ').replace(/\s+/g, ' ').replace(/\s([,.;:])/g, '$1').trim().replace(/^[,;:\-–]\s*/, '');
    if (o.title) o.title = o.title.charAt(0).toUpperCase() + o.title.slice(1);
    return o;
  }
  function chipsFor(o) {
    var c = [];
    if (o.date) c.push('<span class="chip ' + (o.date === today() ? 'hot' : 'ok') + '">📅 ' + esc(dLabel(o.date)) + (o.time ? ' ' + o.time.replace(':', 'h') : '') + '</span>');
    if (o.imp) c.push('<span class="chip hot">⭐ Important</span>');
    if (o.list) c.push('<span class="chip">' + esc(listOf(o.list).name) + '</span>');
    if (o.rec !== 'none') c.push('<span class="chip">↻ ' + esc(REC[o.rec]) + '</span>');
    return c.join('');
  }
  $('#add-in').addEventListener('input', function () { var v = this.value.trim(); $('#chips').innerHTML = v ? chipsFor(smart(v)) : ''; });
  $('#add-form').addEventListener('submit', function (e) {
    e.preventDefault(); var v = $('#add-in').value.trim(); if (!v) return;
    var o = smart(v); if (!o.title) return;
    var t = { id: uid(), title: o.title, note: '', list: o.list || (view === 'lists' && openList ? openList : null), date: o.date, time: o.time, imp: o.imp, rec: o.rec, done: false, created: Date.now(), _u: Date.now() };
    if (!t.date && view === 'today' && !t.imp) t.date = today();
    S.tasks.push(t); save(); $('#add-in').value = ''; $('#chips').innerHTML = ''; render(t.id);
  });

  /* ---------- récurrence ---------- */
  function nextDate(t) {
    var base = t.date && t.date > today() ? t.date : (t.date || today());
    if (t.rec === 'day') return addDays(base < today() ? today() : base, 1);
    if (t.rec === 'week') { var n = addDays(base, 7); while (n <= today()) n = addDays(n, 7); return n; }
    if (t.rec === 'month') { var d = parse(base), day = d.getDate(); do { d = new Date(d.getFullYear(), d.getMonth() + 1, Math.min(day, 28)); } while (iso(d) <= today()); return iso(d); }
    if (t.rec === 'wd') { var x = addDays(base < today() ? today() : base, 1); while (parse(x).getDay() === 0 || parse(x).getDay() === 1) x = addDays(x, 1); return x; }
    return null;
  }
  function complete(t) {
    var snap = JSON.parse(JSON.stringify(t));
    S.log.push({ id: uid(), tid: t.id, title: t.title, list: t.list, d: today(), at: Date.now() });

    return ghPull().then(function (ch) { if (ch) { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} render(); } return ghPush(true); })
      .catch(function (e) { syncMsg(e.message === 'auth' ? 'GitHub refuse l\'accès : vérifie le jeton dans Saiyan.' : 'Hors ligne : enregistré sur ce téléphone.'); });
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') { clearTimeout(saveT); ghPush(); } else { ghSync(); render(); } });
  setInterval(function () { if (document.visibilityState === 'visible') render(); }, 5 * 60e3);

  render(); ghSync();
})();
</script>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="saiyan.webmanifest">
<link rel="apple-touch-icon" href="saiyan-180.png">
<link rel="icon" type="image/png" href="saiyan-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Routines">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E151B" media="(prefers-color-scheme: dark)">
<title>Planning & routines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EEF1F3; --surface: #FFFFFF; --surface-2: #E4E9ED; --ink: #12202B; --muted: #5B6B78; --line: #D3DAE0;
  --accent: #D9480F; --accent-text: #B93E0B; --accent-bg: #FDE6D8; --accent-ink: #FFFFFF;
  --good: #17794D; --good-bg: #DDF1E6; --bad: #B42346; --bad-bg: #F9DCE3;
  --c-muscu: #6B4FD3; --c-run: #0E8A7B; --c-bike: #1B7FB8; --c-race: #D92D2D; --c-wod: #B45309; --c-mob: #BE185D;
  --font-display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151B; --surface: #161F27; --surface-2: #1F2B35; --ink: #E7EDF2; --muted: #93A4B2; --line: #2A3945;
    --accent: #FF8A3D; --accent-text: #FFA05E; --accent-bg: #3A2212; --accent-ink: #1A0F08; --good: #59D08F; --good-bg: #15382A; --bad: #FF6B7D; --bad-bg: #451B24;
    --c-muscu: #A793FF; --c-run: #4FD1C0; --c-bike: #6CB8F0; --c-race: #FF5A5A; --c-wod: #F5B942; --c-mob: #F472B6;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
.wrap { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.nav { display: flex; align-items: center; gap: 8px; }
.nav-label { flex: 1; min-width: 0; text-align: center; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-text); font-weight: 600; }
.nav-label h1 { font: 700 24px/1.15 var(--font-display); text-wrap: balance; }
.icon-btn { width: 44px; height: 44px; flex: none; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn.small { width: 36px; height: 36px; border-radius: 10px; font-size: 20px; line-height: 1; color: var(--muted); }
.icon-btn.tiny { width: 30px; height: 30px; border-radius: 8px; font-size: 17px; line-height: 1; color: var(--muted); background: transparent; border-color: transparent; }
.tabs { display: flex; align-items: center; gap: 8px; }
.seg-tabs { display: flex; flex: 1; min-width: 0; background: var(--surface-2); border-radius: 12px; padding: 3px; }
.seg-tabs button { flex: 1; min-width: 0; padding: 0 4px; font-size: 14px; min-height: 40px; border: 0; background: transparent; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg-tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.today-btn { flex: none; min-height: 44px; padding: 0 12px; border: 1px solid var(--accent); color: var(--accent-text); background: var(--surface); border-radius: 12px; font-weight: 600; font-size: 13px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.m-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.m-head h2, .m-head h3 { font: 600 16px/1.2 var(--font-display); }
.goal { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.pill { flex: none; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--accent-bg); color: var(--accent-text); white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.m-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.field { display: inline-flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--line); padding-bottom: 2px; }
.field:focus-within { border-color: var(--accent); }
.field input {
  width: 4.2em; border: 0; background: transparent; color: var(--ink); padding: 4px 0;
  font: 600 26px/1.1 var(--font-display); font-variant-numeric: tabular-nums; text-align: right; -moz-appearance: textfield; appearance: textfield;
}
.field input::-webkit-outer-spin-button, .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.field input::placeholder { color: var(--line); }
.field input:focus-visible { outline: none; }
.field.dur input { width: 2.4em; }
.field.mini input { width: 3em; font-size: 20px; }
.field.set-f input { width: 3.1em; font-size: 20px; }
.field.set-f.reps input { width: 2em; }
.unit { font-size: 13px; color: var(--muted); }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.quick button, .seg button { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; }
.quick button { background: var(--accent-bg); border-color: transparent; color: var(--accent-text); }
.seg { display: inline-flex; }
.seg button:first-child { border-radius: 10px 0 0 10px; }
.seg button:last-child { border-radius: 0 10px 10px 0; margin-left: -1px; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); position: relative; }
.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .25s ease; }
.bar.good > i { background: var(--good); }
.bar.bad > i { background: var(--bad); }

.score { flex-direction: row; align-items: center; justify-content: space-between; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.score-num { font: 700 34px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.score-lbl { font-size: 13px; font-weight: 500; margin-top: 4px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 28px; height: 8px; border-radius: 999px; background: currentColor; opacity: .3; }
.dots i.on { opacity: 1; }

/* sport */
.muscu { --fam: var(--c-muscu); } .run { --fam: var(--c-run); } .bike { --fam: var(--c-bike); } .race { --fam: var(--c-race); } .wod { --fam: var(--c-wod); } .mob { --fam: var(--c-mob); }
.wod-ed { display: flex; flex-direction: column; gap: 8px; }
.wod-ed input.txt { min-height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 0 10px; font: 15px var(--font-body); width: 100%; min-width: 0; }
.wod-mv { display: grid; grid-template-columns: minmax(0,1fr) 5.2em 4.2em auto; gap: 6px; align-items: center; }
.wod-mv input { min-height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); padding: 0 8px; font: 15px var(--font-body); width: 100%; min-width: 0; }
.wod-res { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.card.sec > .fh { cursor: pointer; }
.card.sec > .fh > :first-child { flex: 1; min-width: 0; }
.card.sec > .fh::after { order: 2; }
.card.sec > .fh { flex-wrap: wrap; row-gap: 4px; }
.card.sec > .fh > .sum { order: 3; flex-basis: 100%; font-size: 14px; line-height: 1.35; }
.card.sec > .fh > .sum:empty { display: none; }
.card > .m-head > .sum.cnt { order: 0; flex: none; flex-basis: auto; background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; line-height: 1.2; }
.card.sec.shut > .fh { align-items: center; }
.card.sec > .fh::after { content: ''; width: 8px; height: 8px; border-left: 2px solid var(--muted); border-top: 2px solid var(--muted); transform: rotate(45deg); margin: 8px 2px 0 6px; flex: none; }
.card.sec.shut > :not(.fh) { display: none !important; }
.card.sec.shut > .fh { border-top: 0 !important; padding-top: 0 !important; }
.card.sec.shut > .fh::after { transform: rotate(-135deg); margin-top: -2px; }
.card.sec.shut .fh .goal { display: none; }

/* ===== Saiyan : couleurs vivantes ===== */
.mic { display: none; }
html[data-style="saiyan"] { --k-kcal: #FF8A3D; --k-water: #3FB6FF; --k-sleep: #A08CFF; --k-screen: #FFC64A; --k-blue: #5BD893; --k-reco: #FF6B8B; --k-nutri: #FFB347; --k-body: #4FD1C0; --k-sport: #FF8A3D; }
html[data-style="saiyan"] body { background: radial-gradient(900px 340px at 50% -120px, rgba(255,138,61,.22), transparent 70%), radial-gradient(700px 300px at 110% 30%, rgba(63,182,255,.07), transparent 70%), var(--bg); background-attachment: fixed; }
html[data-style="saiyan"] .mic { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; margin-right: 9px; vertical-align: -6px; background: color-mix(in srgb, var(--ic) 18%, transparent); }
html[data-style="saiyan"] .mic svg { width: 16px; height: 16px; fill: none; stroke: var(--ic); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
html[data-style="saiyan"] .mic-kcal, html[data-style="saiyan"] #m-kcal, html[data-style="saiyan"] #ring-kcal { --ic: var(--k-kcal); }
html[data-style="saiyan"] .mic-water, html[data-style="saiyan"] #m-water, html[data-style="saiyan"] #ring-water { --ic: var(--k-water); }
html[data-style="saiyan"] .mic-sleep, html[data-style="saiyan"] #m-sleep, html[data-style="saiyan"] #ring-sleep { --ic: var(--k-sleep); }
html[data-style="saiyan"] .mic-screen, html[data-style="saiyan"] #m-screen, html[data-style="saiyan"] #ring-screen { --ic: var(--k-screen); }
html[data-style="saiyan"] .mic-blue, html[data-style="saiyan"] #m-blue, html[data-style="saiyan"] #ring-blue { --ic: var(--k-blue); }
html[data-style="saiyan"] .mic-reco, html[data-style="saiyan"] #m-reco, html[data-style="saiyan"] #ring-reco { --ic: var(--k-reco); }
html[data-style="saiyan"] .mic-nutri, html[data-style="saiyan"] #m-nutri, html[data-style="saiyan"] #ring-nutri { --ic: var(--k-nutri); }
html[data-style="saiyan"] .mic-body, html[data-style="saiyan"] #m-body, html[data-style="saiyan"] #ring-body { --ic: var(--k-body); }
html[data-style="saiyan"] .mic-sport, html[data-style="saiyan"] #m-sport, html[data-style="saiyan"] #ring-sport { --ic: var(--k-sport); }
html[data-style="saiyan"] .card.fold > .bar > i { background: var(--ic); }
html[data-style="saiyan"] .card.fold > .bar.bad > i { background: var(--bad); }
html[data-style="saiyan"] .card.fold > .bar.good > i { background: linear-gradient(90deg, var(--ic), var(--good)); }
html[data-style="saiyan"] .card.fold:not(.shut) { border-color: color-mix(in srgb, var(--ic) 28%, var(--line)); background: linear-gradient(160deg, color-mix(in srgb, var(--ic) 9%, var(--surface)) 0%, var(--surface) 55%); }
html[data-style="saiyan"] .ring .fg { stroke: var(--ic); filter: drop-shadow(0 0 4px color-mix(in srgb, var(--ic) 55%, transparent)); }
html[data-style="saiyan"] .ring.bad .fg { stroke: var(--bad); filter: none; }
html[data-style="saiyan"] .ring span { color: color-mix(in srgb, var(--ic) 75%, var(--muted)); }
html[data-style="saiyan"] .ring.good span { color: var(--ic); font-weight: 600; }
html[data-style="saiyan"] .score { background: linear-gradient(150deg, #24170E 0%, #161F27 60%); border-color: rgba(255,138,61,.35); box-shadow: 0 8px 30px -12px rgba(255,138,61,.45); }
html[data-style="saiyan"] .score-num { background: linear-gradient(90deg, #FFB347, #FF6A2B); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 40px; }
html[data-style="saiyan"] .card.fold.shut.done { background: linear-gradient(90deg, color-mix(in srgb, var(--ic) 22%, #12261C), #15382A); }
html[data-style="saiyan"] .card.fold.shut.done .m-head h2::before { content: none; }
html[data-style="saiyan"] .card.fold.shut.done .mic { background: var(--good); }
html[data-style="saiyan"] .card.fold .quick button { background: color-mix(in srgb, var(--ic) 16%, var(--surface)); color: color-mix(in srgb, var(--ic) 85%, #fff); border-color: transparent; }
html[data-style="saiyan"] .card.fold.shut.done .mic svg { stroke: #0E151B; }
html[data-style="saiyan"] .planned button, html[data-style="saiyan"] .seg button[aria-pressed="true"] { background: linear-gradient(135deg, #FFB347, #FF6A2B); color: #1A0F08; }
html[data-style="saiyan"] .today-btn { background: rgba(255,138,61,.08); }
html[data-style="saiyan"] #nav-title { background: linear-gradient(90deg, #FFFFFF, #FFD2B0); -webkit-background-clip: text; background-clip: text; color: transparent; }
html[data-style="saiyan"] .seg-tabs button[aria-selected="true"] .tab-ic { filter: drop-shadow(0 0 6px rgba(255,138,61,.7)); }

/* ===== Saiyan Ardoise : même style, tons plus clairs ===== */
html[data-style="saiyan"][data-tone="ardoise"] {
  --bg: #2F3B48; --surface: #3B4856; --surface-2: #475565; --ink: #F4F7FA; --muted: #C3CDD8; --line: #536274;
  --accent-bg: #5C3D28; --accent-text: #FFB27A; --good-bg: #2F5745; --bad-bg: #5E3442; --good: #6FE0A2; --bad: #FF8A9C;
}
html[data-style="saiyan"][data-tone="ardoise"] .seg-tabs { background: rgba(47,59,72,.95); }
html[data-style="saiyan"][data-tone="ardoise"] .score { background: linear-gradient(150deg, #5A3E2C 0%, #3B4856 62%); }
html[data-style="saiyan"][data-tone="ardoise"] .card.fold.shut.done { background: linear-gradient(90deg, color-mix(in srgb, var(--ic) 22%, #2F5745), #2F5745); }
html[data-style="saiyan"][data-tone="ardoise"] .card.fold.shut.done .mic svg { stroke: #2F3B48; }
html[data-style="saiyan"][data-tone="ardoise"] .wgrid .c.good { background: #3E9A6C; }
html[data-style="saiyan"][data-tone="ardoise"] .wgrid .c.bad { background: #A84558; }
html[data-style="saiyan"][data-tone="ardoise"] .wgrid .c.sp { background: #6A4329; }
html[data-style="saiyan"][data-tone="ardoise"] body { background: radial-gradient(900px 340px at 50% -120px, rgba(255,154,82,.25), transparent 70%), radial-gradient(700px 300px at 110% 30%, rgba(63,182,255,.08), transparent 70%), var(--bg); background-attachment: fixed; }

/* ===== Saiyan Couleurs : fond sombre, chaque bloc a sa couleur ===== */
html[data-style="saiyan"][data-tone="vif"] .card.card.card { --ic: #8A9BB0; background: linear-gradient(155deg, color-mix(in srgb, var(--ic) 34%, #0E151B) 0%, color-mix(in srgb, var(--ic) 16%, #0E151B) 100%); border-color: color-mix(in srgb, var(--ic) 50%, transparent); }
html[data-style="saiyan"][data-tone="vif"] .card.card.card .goal, html[data-style="saiyan"][data-tone="vif"] .card.card.card .note { color: color-mix(in srgb, var(--ic) 25%, #C9D3DC); }
html[data-style="saiyan"][data-tone="vif"] .card.card.card .bar, html[data-style="saiyan"][data-tone="vif"] .card.card.card .meal, html[data-style="saiyan"][data-tone="vif"] .card.card.card .tile, html[data-style="saiyan"][data-tone="vif"] .card.card.card .s-block, html[data-style="saiyan"][data-tone="vif"] .card.card.card .exo { background: rgba(0,0,0,.22); }
html[data-style="saiyan"][data-tone="vif"] .card.card.card .wgrid .c:not(.good):not(.bad):not(.sp) { background: rgba(0,0,0,.25); }
html[data-style="saiyan"][data-tone="vif"] .card.card.card.fold.shut.done { background: linear-gradient(90deg, color-mix(in srgb, var(--ic) 30%, #15382A), #15382A); border-color: transparent; }
html[data-style="saiyan"][data-tone="vif"] .card.card.card.score { --ic: #FF8A3D; }
html[data-style="saiyan"][data-tone="vif"] .card.card.card input::placeholder { color: rgba(255,255,255,.38); }
html[data-style="saiyan"][data-tone="vif"] .card.card.card .quick button { background: rgba(255,255,255,.10); color: #fff; }
html[data-style="saiyan"][data-tone="vif"] .card.card.card .field { border-bottom-color: rgba(255,255,255,.22); }
html[data-style="saiyan"][data-tone="vif"] .card.card.card .bar { background: rgba(0,0,0,.3); }
html[data-style="saiyan"][data-tone="vif"] .card.card.card.warn { --ic: #FF8A3D; }
html[data-style="saiyan"][data-tone="vif"] #settings.card.card.card, html[data-style="saiyan"][data-tone="vif"] #backup.card.card.card { --ic: #6B7A8C; }
html[data-style="saiyan"][data-tone="vif"] .card.card.card.next-race { background: var(--accent); }
html[data-style="saiyan"][data-tone="vif"] #fd-reco.card.card.card { --ic: #FF6B8B; }
html[data-style="saiyan"][data-tone="vif"] #fd-nutri.card.card.card { --ic: #FFB347; }
html[data-style="saiyan"][data-tone="vif"] #fd-body.card.card.card { --ic: #4FD1C0; }
html[data-style="saiyan"][data-tone="vif"] #fd-sport.card.card.card { --ic: #FF8A3D; }
html[data-style="saiyan"][data-tone="vif"] #fd-plan.card.card.card { --ic: #FF8A3D; }
html[data-style="saiyan"][data-tone="vif"] #fd-grid.card.card.card { --ic: #3FB6FF; }
html[data-style="saiyan"][data-tone="vif"] #fd-greens.card.card.card { --ic: #5BD893; }
html[data-style="saiyan"][data-tone="vif"] #fd-mealsw.card.card.card { --ic: #FFB347; }
html[data-style="saiyan"][data-tone="vif"] #fd-tiles.card.card.card { --ic: #A08CFF; }
html[data-style="saiyan"][data-tone="vif"] #fd-load.card.card.card { --ic: #FF6B8B; }
html[data-style="saiyan"][data-tone="vif"] #fd-energy.card.card.card { --ic: #FFC64A; }
html[data-style="saiyan"][data-tone="vif"] #fd-sportw.card.card.card { --ic: #FF8A3D; }
html[data-style="saiyan"][data-tone="vif"] #fd-bilan.card.card.card { --ic: #7FA7D9; }
html[data-style="saiyan"][data-tone="vif"] #fd-objs.card.card.card { --ic: #A08CFF; }
html[data-style="saiyan"][data-tone="vif"] #fd-races.card.card.card { --ic: #FF5A5A; }
html[data-style="saiyan"][data-tone="vif"] #fd-results.card.card.card { --ic: #FFC64A; }
html[data-style="saiyan"][data-tone="vif"] #fd-energyp.card.card.card { --ic: #FFC64A; }
html[data-style="saiyan"][data-tone="vif"] #fd-histb.card.card.card { --ic: #4FD1C0; }
html[data-style="saiyan"][data-tone="vif"] #fd-histm.card.card.card { --ic: #A08CFF; }
html[data-style="saiyan"][data-tone="vif"] #fd-tiles2.card.card.card { --ic: #A08CFF; }
html[data-style="saiyan"][data-tone="vif"] #m-kcal.card.card.card { --ic: var(--k-kcal); }
html[data-style="saiyan"][data-tone="vif"] #m-water.card.card.card { --ic: var(--k-water); }
html[data-style="saiyan"][data-tone="vif"] #m-sleep.card.card.card { --ic: var(--k-sleep); }
html[data-style="saiyan"][data-tone="vif"] #m-screen.card.card.card { --ic: var(--k-screen); }

/* ===== Crème & Marine (inspiré de la liste de courses) ===== */

/* ----- Système d'en-têtes uniforme ----- */
.card > .m-head ~ .m-head h3 { font: 700 12px/1.3 var(--font-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.card > .m-head ~ .m-head { border-top: 1px solid var(--line); padding-top: 12px; }
.card > .m-head:not(.fh) > .sum { flex: none; background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.card > .m-head .pill { align-self: flex-start; }
.card.sec.shut > .fh .pill { align-self: center; }
.evo-g { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.evo-g + .evo-g { border-top: 1px solid var(--line); padding-top: 12px; }
.evo-row { display: grid; grid-template-columns: 3.6em minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.evo-row:last-child { border-bottom: 0; }
.evo-d { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.evo-n { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.evo-t { display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; }
.evo-t small { font-size: 11.5px; color: var(--muted); }
.tmode { min-height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--muted); font: 600 12px var(--font-body); }
.tmode[aria-pressed="true"] { color: var(--c-muscu); border-color: var(--c-muscu); }
.s-list { display: flex; flex-direction: column; gap: 10px; }
.s-block { border: 1px solid var(--line); border-left: 4px solid var(--fam); border-radius: 12px; padding: 10px 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.s-head { display: flex; align-items: center; gap: 10px; }
.s-name { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; }
.s-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
.s-sum { font-size: 12.5px; font-weight: 600; color: var(--fam); font-variant-numeric: tabular-nums; }
.s-empty { color: var(--muted); font-size: 13.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 500; }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--fam); }
.chip:active { background: var(--accent-bg); border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.sm { min-height: 36px; padding: 0 11px; font-size: 12.5px; }
.chip.add { border-style: dashed; color: var(--accent-text); background: transparent; }
.sub { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sum { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.week-line { font-size: 13.5px; font-weight: 600; color: var(--accent-text); padding-top: 10px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.note { font-size: 13.5px; color: var(--muted); }

.exo { background: var(--surface-2); border-radius: 10px; padding: 10px 10px 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.exo-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.exo-head b { font: 600 15px/1.2 var(--font-display); }
.last { font-size: 12.5px; color: var(--muted); }
.last b { color: var(--accent-text); font-weight: 600; }
.last .pr { color: var(--good); font-weight: 600; }
.set { display: flex; align-items: center; gap: 10px; }
.set-n { width: 24px; height: 24px; flex: none; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--muted); }
.x { color: var(--muted); font-size: 15px; }
.set .grow { flex: 1; }
.exo-foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.add-set { min-height: 38px; padding: 0 14px; border-radius: 10px; border: 1px dashed var(--muted); background: transparent; font-weight: 600; font-size: 13px; color: var(--accent-text); }
.new-move { display: flex; gap: 8px; }
.new-move input { flex: 1; min-width: 0; min-height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 0 12px; font: inherit; font-size: 14px; }
.new-move button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--accent-bg); color: var(--accent-text); font-weight: 600; font-size: 13px; }

/* week */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
.tile b { display: block; color: var(--accent-text); font: 700 24px/1.1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile b.g { color: var(--good); }
.tiles[style*="--tb"] .tile b { font-size: var(--tb); }
.tile span { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 4px; text-align: center; white-space: nowrap; }
th { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
tr.goals td { color: var(--muted); font-size: 11.5px; padding-top: 0; border-bottom: 1px solid var(--line); }
tbody tr + tr td { border-top: 1px solid var(--line); }
td.day { text-align: left; }
td.day button { border: 0; background: transparent; padding: 4px 0; text-align: left; font-weight: 600; min-height: 36px; }
td.day small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
td.good { color: var(--good); background: var(--good-bg); font-weight: 600; }
td.bad { color: var(--bad); background: var(--bad-bg); font-weight: 600; }
tr.today td.day button { color: var(--accent-text); }
.b-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }

.rc { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 0; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; }

.rc-main { flex: 1; min-width: 0; }
.rc-main b { display: block; font-size: 14.5px; }
.rc-main small { display: block; color: var(--muted); font-size: 12.5px; }
.rc-time { flex: none; text-align: right; font: 600 17px/1.2 var(--font-display); color: var(--accent-text); font-variant-numeric: tabular-nums; }
.rc-time small { display: block; font: 600 11.5px var(--font-body); }
.next-race { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.next-race .goal, .next-race .sub { color: var(--accent-ink); opacity: .85; }
.next-race .big { font: 700 40px/1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.r-form { display: flex; flex-direction: column; gap: 12px; }

.r-form input.txt { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 0 12px; font: 15px var(--font-body); text-transform: none; letter-spacing: 0; }
.r-form .two { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
.r-form input.txt { width: 100%; min-width: 0; }
.pb-row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); }
.pb-row:first-of-type { border-top: 0; }
.pb-row b { font: 600 17px var(--font-display); color: var(--good); font-variant-numeric: tabular-nums; }
.countdown { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.countdown b { font: 700 30px/1 var(--font-display); color: var(--accent-text); font-variant-numeric: tabular-nums;  white-space: nowrap; }
.bilan { white-space: pre-wrap; font: 13px/1.55 var(--font-body); background: var(--surface-2); border-radius: 10px; padding: 12px; margin: 0; }
.rest { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 20px rgba(0,0,0,.18); }
.rest .bar { height: 6px; margin-bottom: 10px; }
.rest .bar > i { background: var(--c-muscu); transition: width .25s linear; }
.rest.done .bar > i { background: var(--good); }
.rest-row { max-width: 600px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.rest-row b { font: 700 28px/1 var(--font-display); font-variant-numeric: tabular-nums; min-width: 2.6em; }
.rest.done .rest-row b { color: var(--good); }
.rest-row .lbl { flex: 1; font-size: 13px; color: var(--muted); }
.rest-row button { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; }
.rest-row button.ok { background: var(--c-muscu); border-color: var(--c-muscu); color: #fff; }
body.has-rest { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }

/* ===== Style Sombre Saiyan ===== */
html[data-style="saiyan"] {
  --bg: #0E151B; --surface: #161F27; --surface-2: #1F2B35; --ink: #E7EDF2; --muted: #93A4B2; --line: #2A3945;
  --accent: #FF8A3D; --accent-text: #FFA05E; --accent-bg: #3A2212; --accent-ink: #1A0F08; --good: #59D08F; --good-bg: #15382A; --bad: #FF6B7D; --bad-bg: #451B24;
  --c-muscu: #A793FF; --c-run: #4FD1C0; --c-bike: #6CB8F0; --c-race: #FF5A5A; --c-wod: #F5B942; --c-mob: #F472B6;
  color-scheme: dark;
}
.tab-ic { display: none; }
html[data-style="saiyan"] body { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

html[data-style="saiyan"] .seg-tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; border-radius: 0; padding: 6px max(10px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px));
  background: rgba(14,21,27,.94); border-top: 1px solid var(--line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
html[data-style="saiyan"] .seg-tabs button { min-width: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 54px; font-size: 11px; background: transparent !important; color: var(--muted); }
html[data-style="saiyan"] .seg-tabs button[aria-selected="true"] { color: var(--accent); }
html[data-style="saiyan"] .tab-ic { display: block; width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
html[data-style="saiyan"] .rest { bottom: calc(66px + env(safe-area-inset-bottom, 0px)); padding-bottom: 10px; }
.rings { display: none; }
html[data-style="saiyan"] .score { flex-direction: column; align-items: stretch; gap: 14px; background: var(--surface); border-color: var(--line); color: var(--ink); }
html[data-style="saiyan"] .score .dots { display: none; }

html[data-style="saiyan"] .score-lbl { color: var(--muted); }
html[data-style="saiyan"] .rings { display: flex; justify-content: space-between; gap: 4px; }
.ring { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; background: none; border: 0; padding: 0; min-width: 0; }
.ring svg { width: 52px; height: 52px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 5; }
.ring .bg { stroke: var(--surface-2); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .3s ease; }
.ring.good .fg { stroke: var(--good); }
.ring.bad .fg { stroke: var(--bad); }
.ring span { font-size: 11px; color: var(--muted); white-space: nowrap; }
.ring.good span { color: var(--good); }
.ring.bad span { color: var(--bad); }
html[data-style="saiyan"] .card.fold > .m-head { cursor: pointer; }
html[data-style="saiyan"] .card.fold > .m-head > div:first-child { flex: 1; min-width: 0; }
html[data-style="saiyan"] .card.fold > .m-head::after { content: ''; width: 8px; height: 8px; border-left: 2px solid var(--muted); border-top: 2px solid var(--muted); transform: rotate(45deg); margin: 8px 2px 0 4px; flex: none; }
html[data-style="saiyan"] .card.fold.shut { flex-direction: row; align-items: center; padding: 10px 14px; cursor: pointer; }
html[data-style="saiyan"] .card.fold.shut > :not(.m-head) { display: none; }

html[data-style="saiyan"] .card.fold.shut.done { background: var(--good-bg); border-color: transparent; }

.wgrid { display: grid; grid-template-columns: 58px repeat(7, 1fr); gap: 4px; font-variant-numeric: tabular-nums; }
.wgrid .h { font-size: 11px; color: var(--muted); text-align: center; padding: 2px 0; background: none; border: 0; }

.off { --fam: var(--muted); }

      '<div style="border-top:1px solid var(--line);margin:4px 0 0"></div><div><h3>Sections affichées</h3><span class="goal">Touche pour masquer ce qui ne te sert pas, tes données restent enregistrées</span></div>' +
      ['Jour', 'Semaine'].map(function (v) { return '<div class="sub">' + v + '</div><div class="chips">' + SECTIONS.filter(function (x) { return x[2] === v; }).map(function (x) { return '<button class="chip sm" data-action="toggle-sec" data-k="' + x[0] + '" aria-pressed="' + shown(x[0]) + '">' + (shown(x[0]) ? '' : '<s>') + x[1] + (shown(x[0]) ? '' : '</s>') + '</button>'; }).join('') + '</div>'; }).join('') +
      '<div class="m-row" style="justify-content:space-between"><div><span class="sub">Import Apple Santé</span><span class="goal">Affiche le bouton d\'import en haut de cet onglet</span></div><button class="chip sm" data-action="toggle-health" aria-pressed="' + settings.health + '">' + (settings.health ? 'Affiché' : 'Masqué') + '</button></div>' +
      '<div style="border-top:1px solid var(--line);margin:4px 0 0"></div>' +
      '<div class="m-head"><div><h3>Chaussures</h3><span class="goal">Kilométrage suivi à partir des sorties où tu les choisis</span></div></div>' +
      settings.shoes.map(function (x) {
        var k = shoeKm(x), pc = Math.min(100, Math.round(k / x.limit * 100)), cls = pc >= 100 ? 'bad' : pc >= 90 ? '' : 'good';
        return '<div style="display:flex;flex-direction:column;gap:4px;opacity:' + (x.retired ? .55 : 1) + '"><div class="m-row" style="justify-content:space-between"><b style="font-size:14px">' + esc(x.name) + (x.retired ? ' (retirées)' : '') + '</b><span class="sum">' + fmtN(k) + ' / ' + fmtN(x.limit) + ' km</span></div>' +
          '<div class="bar ' + cls + '"><i style="width:' + pc + '%"></i></div><div class="m-row"><button class="chip sm" data-action="shoe-retire" data-id="' + x.id + '">' + (x.retired ? 'Réactiver' : 'Retirer') + '</button><button class="chip sm" data-action="shoe-del" data-id="' + x.id + '">Supprimer</button></div></div>';
      }).join('') +
      '<div class="r-form" style="gap:8px"><input class="pe-note" id="sh-name" type="text" maxlength="40" placeholder="Nom (ex. Rebel 5)"><div class="m-row">' +
      '<label class="field mini"><span class="sr">Km déjà faits</span><input id="sh-start" type="number" inputmode="numeric" min="0" placeholder="0"><span class="unit">km déjà faits</span></label>' +
      '<label class="field mini"><span class="sr">Limite</span><input id="sh-limit" type="number" inputmode="numeric" min="100" placeholder="700"><span class="unit">km max</span></label></div>' +
      '<button class="pe-save" style="align-self:flex-start" data-action="shoe-add">Ajouter la paire</button></div>';
  }
  $('#settings').addEventListener('change', function (e) {
    var gk = e.target.dataset.goal;
    if (gk) {
      var v0 = num(e.target.value), o = JSON.parse(JSON.stringify(settings));
      if (v0 != null) o[gk] = gk === 'sleep' || gk === 'screen' ? v0 * 60 : v0;
      settings = cleanSettings(o); saveGoals(); renderSettings(); render();
      var m = $('#set-msg'); if (m) m.textContent = 'Objectif enregistré.';
      return;
    }
    if (e.target.dataset.field !== 'fcmax') return;
    var v = num(e.target.value);
    if (v && v >= 140 && v <= 230) { settings.fcmax = Math.round(v); saveGoals(); render(); }
    renderSettings();
  });

  /* ---------- sauvegarde ---------- */
  var LS_EXPORT = 'ced-routines-last-export';
  function backupMsg(t) { $('#backup-msg').textContent = t; }
  function backupInfo() {
    var n = Object.keys(days).filter(function (k) { return hasData(days[k]); }).length, last = null;
    try { last = localStorage.getItem(LS_EXPORT); } catch (e) {}
    var t = plural(n, 'jour') + (n > 1 ? ' enregistrés' : ' enregistré');
    if (last) t += ' · dernière copie le ' + parse(last).toLocaleDateString('fr-FR');
    backupMsg(t);
  }
  function markExported() { try { localStorage.setItem(LS_EXPORT, todayStr()); } catch (e) {} backupInfo(); if (view === 'day' && !isTyping()) render(); }
  $('#btn-export').addEventListener('click', function () {
    var out = snapshot();
    var name = 'routines-' + todayStr() + '.json';
    var text = JSON.stringify({ app: 'routines', version: 2, exported: new Date().toISOString(), moves: customMoves, goals: bodyGoals, settings: settings, races: races, days: out }, null, 2);
    var file = null;
    try { file = new File([text], name, { type: 'application/json' }); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).then(markExported, function () {});
      return;
    }
    var copied = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { backupMsg('Copie placée dans le presse-papiers : colle-la dans un fichier .json.'); markExported(); copied = true; }, download);
        return;
      }
    } catch (e) {}
    download();
    function download() {
      if (copied) return;
      var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      var a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      markExported();
    }
  });
  $('#btn-import').addEventListener('click', function () { $('#file-import').click(); });
  $('#file-import').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var o = JSON.parse(r.result), src = o && o.days ? o.days : o, n = 0;
        if (o && Array.isArray(o.moves)) { o.moves.forEach(function (m) { if (typeof m === 'string' && customMoves.indexOf(m) < 0) customMoves.push(m); }); saveCustomMoves(); }
        if (o && Array.isArray(o.races)) { races = cleanRaces(o.races); saveRaces(); }
        if (o && o.settings && typeof o.settings === 'object') { settings = cleanSettings(o.settings); applyGoals(); }
        if (o && o.goals && typeof o.goals === 'object') { bodyGoals = cleanGoals(o.goals); }
        saveGoals(); renderSettings();
        Object.keys(src).forEach(function (k) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !src[k] || typeof src[k] !== 'object') return;
          days[k] = normalize(src[k], k); n++;
          if (db) touch(k);
        });
        if (!n) { backupMsg("Ce fichier ne contient aucune journée."); return; }
        persistLocal(); render();
        backupMsg(plural(n, 'jour') + (n > 1 ? ' importés.' : ' importé.'));
      } catch (err) { backupMsg("Fichier illisible : choisis une copie exportée depuis cette appli."); }
    };
    r.onerror = function () { backupMsg("Impossible de lire ce fichier."); };
    r.readAsText(f);
    e.target.value = '';
  });

  /* ---------- démarrage ---------- */
  loadLocal();
  renderSettings();
  render();
  setSync('local');
  backupInfo();
  idbGet().then(function (stored) {
    if (!stored || typeof stored !== 'object') { persistLocal(); return; }
    var changed = false;
    Object.keys(stored).forEach(function (k) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      if (!days[k] || !hasData(days[k])) { days[k] = normalize(stored[k], k); changed = true; }
    });
    if (changed) { if (isTyping()) needsRender = true; else render(); backupInfo(); }
    persistLocal();
  });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') persistLocal(); });
  window.addEventListener('pagehide', persistLocal);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.claude) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('saiyan-sw.js', { scope: './Saiyan.html' }).catch(function () {}); });
  }
  try {
    if (window.claude && window.claude.use) {
      window.claude.use('db').then(function (handle) {
        if (!handle) return;
        db = handle;
        setSync('loading');
        loadTimer = setTimeout(function () { setSync('slow'); }, 10000);
        db.collection('days').onSnapshot(onDaysSnap, function () { clearTimeout(loadTimer); setSync('error'); });
      }, function () {});
    }
  } catch (err) {}
})();
</script>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="saiyan.webmanifest">
<link rel="apple-touch-icon" href="saiyan-180.png">
<link rel="icon" type="image/png" href="saiyan-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Routines">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E151B" media="(prefers-color-scheme: dark)">
<title>Planning & routines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EEF1F3; --surface: #FFFFFF; --surface-2: #E4E9ED; --ink: #12202B; --muted: #5B6B78; --line: #D3DAE0;
  --accent: #D9480F; --accent-text: #B93E0B; --accent-bg: #FDE6D8; --accent-ink: #FFFFFF;
  --good: #17794D; --good-bg: #DDF1E6; --bad: #B42346; --bad-bg: #F9DCE3;
  --c-muscu: #6B4FD3; --c-run: #0E8A7B; --c-bike: #1B7FB8; --c-race: #D92D2D;
  --font-display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151B; --surface: #161F27; --surface-2: #1F2B35; --ink: #E7EDF2; --muted: #93A4B2; --line: #2A3945;
    --accent: #FF8A3D; --accent-text: #FFA05E; --accent-bg: #3A2212; --accent-ink: #1A0F08; --good: #59D08F; --good-bg: #15382A; --bad: #FF6B7D; --bad-bg: #451B24;
    --c-muscu: #A793FF; --c-run: #4FD1C0; --c-bike: #6CB8F0; --c-race: #FF5A5A;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
.wrap { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.nav { display: flex; align-items: center; gap: 8px; }
.nav-label { flex: 1; min-width: 0; text-align: center; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-text); font-weight: 600; }
.nav-label h1 { font: 700 24px/1.15 var(--font-display); text-wrap: balance; }
.icon-btn { width: 44px; height: 44px; flex: none; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn.small { width: 36px; height: 36px; border-radius: 10px; font-size: 20px; line-height: 1; color: var(--muted); }
.icon-btn.tiny { width: 30px; height: 30px; border-radius: 8px; font-size: 17px; line-height: 1; color: var(--muted); background: transparent; border-color: transparent; }
.tabs { display: flex; align-items: center; gap: 8px; }
.seg-tabs { display: flex; flex: 1; background: var(--surface-2); border-radius: 12px; padding: 3px; }
.seg-tabs button { flex: 1; min-width: 0; padding: 0 4px; font-size: 14px; min-height: 40px; border: 0; background: transparent; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg-tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.today-btn { min-height: 44px; padding: 0 14px; border: 1px solid var(--accent); color: var(--accent-text); background: var(--surface); border-radius: 12px; font-weight: 600; font-size: 13px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.m-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.m-head h2, .m-head h3 { font: 600 16px/1.2 var(--font-display); }
.goal { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.pill { flex: none; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--accent-bg); color: var(--accent-text); white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.m-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.field { display: inline-flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--line); padding-bottom: 2px; }
.field:focus-within { border-color: var(--accent); }
.field input {
  width: 4.2em; border: 0; background: transparent; color: var(--ink); padding: 4px 0;
  font: 600 26px/1.1 var(--font-display); font-variant-numeric: tabular-nums; text-align: right; -moz-appearance: textfield; appearance: textfield;
}
.field input::-webkit-outer-spin-button, .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.field input::placeholder { color: var(--line); }
.field input:focus-visible { outline: none; }
.field.dur input { width: 2.4em; }
.field.mini input { width: 3em; font-size: 20px; }
.field.set-f input { width: 3.1em; font-size: 20px; }
.field.set-f.reps input { width: 2em; }
.unit { font-size: 13px; color: var(--muted); }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.quick button, .seg button { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; }
.quick button { background: var(--accent-bg); border-color: transparent; color: var(--accent-text); }
.seg { display: inline-flex; }
.seg button:first-child { border-radius: 10px 0 0 10px; }
.seg button:last-child { border-radius: 0 10px 10px 0; margin-left: -1px; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); position: relative; }
.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .25s ease; }
.bar.good > i { background: var(--good); }
.bar.bad > i { background: var(--bad); }

.score { flex-direction: row; align-items: center; justify-content: space-between; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.score-num { font: 700 34px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.score-lbl { font-size: 13px; font-weight: 500; margin-top: 4px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 28px; height: 8px; border-radius: 999px; background: currentColor; opacity: .3; }
.dots i.on { opacity: 1; }

/* sport */
.muscu { --fam: var(--c-muscu); } .run { --fam: var(--c-run); } .bike { --fam: var(--c-bike); } .race { --fam: var(--c-race); }
.s-list { display: flex; flex-direction: column; gap: 10px; }
.s-block { border: 1px solid var(--line); border-left: 4px solid var(--fam); border-radius: 12px; padding: 10px 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.s-head { display: flex; align-items: center; gap: 10px; }
.s-name { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; }
.s-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
.s-sum { font-size: 12.5px; font-weight: 600; color: var(--fam); font-variant-numeric: tabular-nums; }
.s-empty { color: var(--muted); font-size: 13.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 500; }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--fam); }
.chip:active { background: var(--accent-bg); border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.sm { min-height: 36px; padding: 0 11px; font-size: 12.5px; }
.chip.add { border-style: dashed; color: var(--accent-text); background: transparent; }
.sub { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sum { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.week-line { font-size: 13.5px; font-weight: 600; color: var(--accent-text); padding-top: 10px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.note { font-size: 13.5px; color: var(--muted); }

.exo { background: var(--surface-2); border-radius: 10px; padding: 10px 10px 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.exo-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.exo-head b { font: 600 15px/1.2 var(--font-display); }
.last { font-size: 12.5px; color: var(--muted); }
.last b { color: var(--accent-text); font-weight: 600; }
.last .pr { color: var(--good); font-weight: 600; }
.set { display: flex; align-items: center; gap: 10px; }
.set-n { width: 24px; height: 24px; flex: none; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--muted); }
.x { color: var(--muted); font-size: 15px; }
.set .grow { flex: 1; }
.exo-foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.add-set { min-height: 38px; padding: 0 14px; border-radius: 10px; border: 1px dashed var(--muted); background: transparent; font-weight: 600; font-size: 13px; color: var(--accent-text); }
.new-move { display: flex; gap: 8px; }
.new-move input { flex: 1; min-width: 0; min-height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 0 12px; font: inherit; font-size: 14px; }
.new-move button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--accent-bg); color: var(--accent-text); font-weight: 600; font-size: 13px; }

/* week */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
.tile b { display: block; color: var(--accent-text); font: 700 24px/1.1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile b.g { color: var(--good); }
.tile span { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 4px; text-align: center; white-space: nowrap; }
th { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
tr.goals td { color: var(--muted); font-size: 11.5px; padding-top: 0; border-bottom: 1px solid var(--line); }
tbody tr + tr td { border-top: 1px solid var(--line); }
td.day { text-align: left; }
td.day button { border: 0; background: transparent; padding: 4px 0; text-align: left; font-weight: 600; min-height: 36px; }
td.day small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
td.good { color: var(--good); background: var(--good-bg); font-weight: 600; }
td.bad { color: var(--bad); background: var(--bad-bg); font-weight: 600; }
tr.today td.day button { color: var(--accent-text); }
.b-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.b-row .bar > i { background: var(--fam); }
.b-row .bar { grid-column: 1 / -1; height: 6px; }
.b-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.b-name i { width: 9px; height: 9px; border-radius: 50%; background: var(--fam); }

/* progress */
.stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stats4 .tile { padding: 10px 6px; text-align: center; }
.stats4 .tile b { font-size: 18px; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-dasharray: 3 3; }
.chart .ax { fill: var(--muted); font: 10px var(--font-body); }
.chart .ln { fill: none; stroke: var(--c-muscu); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .ln2 { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 4 3; }
.chart .pt { fill: var(--c-muscu); stroke: var(--surface); stroke-width: 2; }
.chart .area { fill: var(--c-muscu); opacity: .12; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.h-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.h-row:first-of-type { border-top: 0; }
.h-date { font-weight: 600; font-size: 14px; }
.h-sets { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.h-top { font: 600 16px/1.2 var(--font-display); color: var(--accent-text); white-space: nowrap; }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
.tip { font-size: 12.5px; color: var(--ink); background: var(--surface); border-radius: 8px; padding: 6px 10px; }
.tip b { color: var(--good); }
.tpl { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; padding: 10px 12px; border: 1px dashed var(--c-muscu); border-radius: 10px; background: transparent; text-align: left; font-weight: 600; font-size: 14px; color: var(--c-muscu); }
.tpl small { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.planned { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--accent-bg); }
.planned .p-txt { flex: 1; min-width: 0; font-size: 13.5px; }
.planned .p-txt b { display: block; color: var(--accent-text); }
.planned button { min-height: 38px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 13px; }
.warn { background: var(--accent-bg); border-color: var(--accent); flex-direction: row; align-items: center; }
.warn p { flex: 1; font-size: 13.5px; color: var(--accent-text); font-weight: 500; }
.warn button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 13px; white-space: nowrap; }
.count { display: flex; align-items: center; gap: 14px; }
.count b { font: 700 28px/1 var(--font-display); min-width: 1.4em; text-align: center; font-variant-numeric: tabular-nums; }
.meals { display: grid; grid-template-columns: 1fr; gap: 6px; }
.meal { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-align: left; font-size: 14px; }
.meal .box { width: 22px; height: 22px; flex: none; border: 2px solid var(--line); border-radius: 7px; display: grid; place-items: center; font-size: 12px; }
.meal small { margin-left: auto; color: var(--muted); font-size: 12px; }
.meal[aria-pressed="true"] { background: var(--good-bg); border-color: transparent; }
.meal[aria-pressed="true"] .box { background: var(--good); border-color: var(--good); color: var(--surface); }
.plan-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 0; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; }
.plan-row:first-of-type { border-top: 0; }
.plan-row .pd { width: 54px; flex: none; font-weight: 600; font-size: 13.5px; }
.plan-row .pl { flex: 1; min-width: 0; font-size: 13.5px; }
.plan-row .pl small { display: block; color: var(--muted); font-size: 12px; }
.plan-row .ps { flex: none; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.plan-row .ps.good { background: var(--good-bg); color: var(--good); }
.plan-row .ps.bad { background: var(--bad-bg); color: var(--bad); }
.plan-row.today .pd { color: var(--accent-text); }
.pday { padding: 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.pday:first-child { border-top: 0; }
.pday-head { display: flex; align-items: center; gap: 10px; }
.pday-head .pd { border: 0; background: transparent; padding: 0; font-weight: 600; font-size: 14px; min-height: 32px; }
.pday.today .pd { color: var(--accent-text); }
.pday-head .pr { font-size: 13px; color: var(--muted); }
.pe-add { margin-left: auto; min-height: 34px; padding: 0 12px; border-radius: 10px; border: 1px dashed var(--muted); background: transparent; font-weight: 600; font-size: 12.5px; color: var(--accent-text); }
.pi { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 10px; border: 1px solid var(--line); border-left: 4px solid var(--fam); border-radius: 10px; }
.pi-main { flex: 1; min-width: 0; border: 0; background: transparent; padding: 2px 0; text-align: left; font-size: 13.5px; font-weight: 600; }
.pi-main small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.pi .ps { flex: none; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.pi .ps.good { background: var(--good-bg); color: var(--good); }
.pi .ps.bad { background: var(--bad-bg); color: var(--bad); }
.plan-ed { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: var(--surface-2); }
.plan-ed .chip { background: var(--surface); }
.plan-ed .chip[aria-pressed="true"] { background: var(--accent); }
.pe-note { flex: 1; min-width: 0; min-height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 0 12px; font: inherit; font-size: 14px; }
.pe-save { min-height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 13.5px; }
.pe-save:disabled { opacity: .4; }
.pe-cancel { min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 600; font-size: 13px; }
.rc { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 0; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; }
.rc:first-of-type { border-top: 0; }
.rc-date { width: 46px; flex: none; text-align: center; line-height: 1.1; }
.rc-date b { display: block; font: 700 20px/1 var(--font-display); }
.rc-date small { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.rc-main { flex: 1; min-width: 0; }
.rc-main b { display: block; font-size: 14.5px; }
.rc-main small { display: block; color: var(--muted); font-size: 12.5px; }
.rc-time { flex: none; text-align: right; font: 600 17px/1.2 var(--font-display); color: var(--accent-text); font-variant-numeric: tabular-nums; }
.rc-time small { display: block; font: 600 11.5px var(--font-body); }
.next-race { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.next-race .goal, .next-race .sub { color: var(--accent-ink); opacity: .85; }
.next-race .big { font: 700 40px/1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.r-form { display: flex; flex-direction: column; gap: 12px; }
.r-form label.blk { display: flex; flex-direction: column; gap: 4px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.r-form input.txt { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 0 12px; font: 15px var(--font-body); text-transform: none; letter-spacing: 0; }
.r-form .two { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
.r-form input.txt { width: 100%; min-width: 0; }
.pb-row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); }
.pb-row:first-of-type { border-top: 0; }
.pb-row b { font: 600 17px var(--font-display); color: var(--good); font-variant-numeric: tabular-nums; }
.countdown { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.countdown b { font: 700 30px/1 var(--font-display); color: var(--accent-text); font-variant-numeric: tabular-nums;  white-space: nowrap; }
.bilan { white-space: pre-wrap; font: 13px/1.55 var(--font-body); background: var(--surface-2); border-radius: 10px; padding: 12px; margin: 0; }
.rest { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 20px rgba(0,0,0,.18); }
.rest .bar { height: 6px; margin-bottom: 10px; }
.rest .bar > i { background: var(--c-muscu); transition: width .25s linear; }
.rest.done .bar > i { background: var(--good); }
.rest-row { max-width: 600px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.rest-row b { font: 700 28px/1 var(--font-display); font-variant-numeric: tabular-nums; min-width: 2.6em; }
.rest.done .rest-row b { color: var(--good); }
.rest-row .lbl { flex: 1; font-size: 13px; color: var(--muted); }
.rest-row button { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; }
.rest-row button.ok { background: var(--c-muscu); border-color: var(--c-muscu); color: #fff; }
body.has-rest { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }

<body>

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:12px">
    <div class="nav">
      <button class="icon-btn" id="btn-prev" data-action="prev" aria-label="Précédent"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="nav-label"><div class="eyebrow" id="eyebrow"></div><h1 id="nav-title"></h1></div>
      <button class="icon-btn" id="btn-next" data-action="next" aria-label="Suivant"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="tabs">
      <div class="seg-tabs" role="tablist">
        <button role="tab" id="tab-day" data-action="tab" data-view="day">Jour</button>
        <button role="tab" id="tab-week" data-action="tab" data-view="week">Semaine</button>
        <button role="tab" id="tab-prog" data-action="tab" data-view="prog">Progrès</button>
        <button role="tab" id="tab-race" data-action="tab" data-view="race">Courses</button>
      </div>
      <button class="today-btn" id="today-btn" data-action="today">Aujourd'hui</button>
    </div>
  </header>
  <main id="content" style="display:flex;flex-direction:column;gap:14px"></main>
  <section class="card" id="settings"></section>
  <section class="card" id="backup">
    <div class="m-head"><div><h3>Sauvegarde</h3><span class="goal">Tes données sont enregistrées sur ce téléphone.</span></div></div>
    <div class="quick"><button type="button" id="btn-export">Exporter une copie</button><button type="button" id="btn-import">Importer une copie</button></div>
    <input type="file" id="file-import" accept=".json,application/json" hidden>
    <p class="note" id="backup-msg" role="status"></p>
  </section>
  <p class="foot" id="sync"></p>
</div>
<div class="rest" id="rest" hidden>
  <div class="bar"><i id="rest-fill"></i></div>
  <div class="rest-row"><b id="rest-time">2:00</b><span class="lbl" id="rest-lbl">Repos</span>
    <button data-action="rest" data-v="-15" aria-label="Retirer 15 secondes">−15</button><button data-action="rest" data-v="15" aria-label="Ajouter 15 secondes">+15</button><button class="ok" data-action="rest" data-v="stop">OK</button></div>
</div>

<script>
(function () {
  'use strict';
  var GOALS = { kcal: 1950, water: 3, sleep: 450, screen: 300, coffee: 3 };
  var SPORT_START = '2026-11-16';
  var KEYS = ['kcal', 'water', 'sleep', 'screen', 'blue'];
  var SPORTS = [
    { id: 'muscu-haut', label: 'Musculation haut du corps', fam: 'muscu' },
    { id: 'muscu-bas', label: 'Musculation bas du corps', fam: 'muscu' },
    { id: 'muscu-full', label: 'Musculation Full Body', fam: 'muscu' },
    { id: 'run-ef', label: 'Running EF', fam: 'run' },
    { id: 'run-q', label: 'Running séance qualité', fam: 'run' },
    { id: 'run-sl', label: 'Running sortie longue', fam: 'run' },
    { id: 'course', label: 'Course', fam: 'race' },
    { id: 'velo-taf', label: 'Vélo taf', fam: 'bike' }
  ];
  /* Mouvements proposés selon la séance choisie (tous restent accessibles via « Autres »). */
  var MOVES_BY_TYPE = {
    'muscu-haut': ['Bench Press', 'Bent Rows', 'Strict Pull-ups', 'Push Press', 'Dips', 'Shoulder Press'],
    'muscu-bas': ['Back Squat', 'Front Squat', 'Deadlift', 'Fentes', 'Hip Thrust', 'Mollets'],
    'muscu-full': ['Back Squat', 'Bench Press', 'Deadlift', 'Bent Rows', 'Push Press', 'Strict Pull-ups']
  };
  var DEFAULT_MOVES = ['Bench Press', 'Back Squat', 'Deadlift', 'Push Press', 'Bent Rows', 'Strict Pull-ups', 'Front Squat', 'Dips', 'Shoulder Press', 'Fentes', 'Hip Thrust', 'Mollets'];
  var LS_KEY = 'ced-routines-v1';
  var LS_MOVES = 'ced-routines-moves';

  var $ = function (s) { return document.querySelector(s); };
  var content = $('#content');

  /* ---------- dates ---------- */
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
  function todayStr() { return ymd(new Date()); }
  function weekStart(s) { var d = parse(s); var wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return ymd(d); }
  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
    var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / 86400000 + 1) / 7);
  }
  var fmtLong = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  var fmtWd = new Intl.DateTimeFormat('fr-FR', { weekday: 'short' });
  var fmtMonthL = new Intl.DateTimeFormat('fr-FR', { month: 'long' });
  var fmtMonthS = new Intl.DateTimeFormat('fr-FR', { month: 'short' });
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function dm(s) { var p = s.split('-'); return p[2] + '/' + p[1]; }

  /* ---------- formats ---------- */
  function fmtN(n) { return Math.round(n).toLocaleString('fr-FR'); }
  function fmtD(n, d) { return n.toLocaleString('fr-FR', { maximumFractionDigits: d == null ? 1 : d }); }
  function fmtL(n) { return fmtD(n, 2) + ' L'; }
  function fmtDur(min) { min = Math.round(min); var h = Math.floor(min / 60), m = min % 60; if (h === 0) return m + ' min'; if (m === 0) return h + ' h'; return h + ' h ' + pad(m); }
  function fmtDurC(min) { min = Math.round(min); var h = Math.floor(min / 60), m = min % 60; if (h === 0) return m + ' min'; return h + 'h' + pad(m); }
  function fmtPace(minPerKm) { var t = Math.round(minPerKm * 60); return Math.floor(t / 60) + ':' + pad(t % 60) + ' /km'; }
  function fmtTon(kg) { return kg >= 1000 ? fmtD(kg / 1000, 1) + ' t' : fmtN(kg) + ' kg'; }
  function num(v) { if (v === '' || v == null) return null; var n = parseFloat(String(v).replace(',', '.')); return isFinite(n) && n >= 0 ? n : null; }
  function plural(n, w) { return n + ' ' + w + (n > 1 ? 's' : ''); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }

  /* ---------- state ---------- */
  var days = {};
  var view = 'day';
  var cur = todayStr();
  var progMove = null;
  var progTab = 'body';
  var bodyMetric = 'weight';
  var openPicker = {};
  var db = null, migrated = false, needsRender = false, loadTimer = null;

  function emptyDay(date) { return { date: date, kcal: null, water: null, sleepMin: null, screenMin: null, blue: false, blueMin: null, weight: null, fat: null, muscle: null, waist: null, hrRest: null, hrv: null, coffee: null, meals: [], plan: [], sports: [] }; }
  function normSet(x) { return { w: num(x && x.w), r: num(x && x.r) }; }
  function normExo(e) {
    return { id: String(e.id || uid('e')), move: String(e.move || ''), rir: num(e.rir), sets: Array.isArray(e.sets) ? e.sets.map(normSet) : [] };
  }
  function normalize(o, date) {
    var e = emptyDay(date);
    e.kcal = num(o.kcal); e.water = num(o.water); e.sleepMin = num(o.sleepMin); e.screenMin = num(o.screenMin);
    e.blue = !!o.blue; e.blueMin = num(o.blueMin);
    e.weight = num(o.weight); e.fat = num(o.fat); e.muscle = num(o.muscle); e.waist = num(o.waist);
    e.hrRest = num(o.hrRest); e.hrv = num(o.hrv); e.coffee = num(o.coffee);
    if (Array.isArray(o.plan)) e.plan = o.plan.filter(function (x) { return x && x.type; }).map(function (x) { return { id: String(x.id || uid('p')), type: String(x.type), min: num(x.min), note: String(x.note || '').slice(0, 120) }; });
    if (Array.isArray(o.meals)) e.meals = o.meals.map(Number).filter(function (i) { return i >= 0 && i < 5; });
    if (Array.isArray(o.sports)) e.sports = o.sports.map(function (s) {
      return {
        id: String(s.id), type: String(s.type), min: num(s.min), km: num(s.km), hr: num(s.hr),
        exos: Array.isArray(s.exos) ? s.exos.map(normExo) : []
      };
    });
    return e;
  }
  function hasData(d) { return hasLog(d) || d.plan.length > 0; }
  function hasLog(d) { return d.kcal != null || d.water != null || d.sleepMin != null || d.screenMin != null || d.blue || d.blueMin != null || hasBody(d) || d.hrRest != null || d.hrv != null || d.coffee != null || d.meals.length > 0 || d.sports.length > 0; }
  function hasBody(d) { return d.weight != null || d.fat != null || d.muscle != null || d.waist != null; }
  function get(date) { return days[date] || (days[date] = emptyDay(date)); }
  function sportDef(type) { return SPORTS.filter(function (x) { return x.id === type; })[0] || { label: type, fam: 'muscu' }; }
  function findSport(d, sid) { return d.sports.filter(function (x) { return x.id === sid; })[0]; }
  function findExo(s, eid) { return s && s.exos.filter(function (x) { return x.id === eid; })[0]; }

  /* ---------- mouvements ---------- */
  var customMoves = [];
  try { customMoves = JSON.parse(localStorage.getItem(LS_MOVES) || '[]') || []; } catch (e) {}
  function allMoves() {
    var seen = {}, out = [];
    function add(m) { if (m && !seen[m]) { seen[m] = 1; out.push(m); } }
    DEFAULT_MOVES.forEach(add); customMoves.forEach(add);
    Object.keys(days).forEach(function (k) { days[k].sports.forEach(function (s) { s.exos.forEach(function (e) { add(e.move); }); }); });
    return out;
  }
  function saveCustomMoves() { try { localStorage.setItem(LS_MOVES, JSON.stringify(customMoves)); } catch (e) {} }

  /* ---------- composition corporelle ---------- */
  var BODY = [
    { k: 'weight', label: 'Poids', unit: 'kg', step: 0.1, dec: 1, down: true },
    { k: 'fat', label: 'Masse grasse', unit: '%', step: 0.1, dec: 1, down: true },
    { k: 'muscle', label: 'Masse musculaire', unit: 'kg', step: 0.1, dec: 1, down: false },
    { k: 'waist', label: 'Tour de taille', unit: 'cm', step: 0.5, dec: 1, down: true }
  ];
  var LS_GOALS = 'ced-routines-body-goals';
  var bodyGoals = { weight: 72.5 };
  try { var gg = JSON.parse(localStorage.getItem(LS_GOALS) || 'null'); if (gg && typeof gg === 'object') bodyGoals = cleanGoals(gg); } catch (e) {}
  function cleanGoals(o) { var g = {}; BODY.forEach(function (b) { var v = num(o[b.k]); if (v != null && v > 0) g[b.k] = v; }); return g; }
  var LS_SET = 'ced-routines-settings';
  var settings = cleanSettings({});
  try { var s0 = JSON.parse(localStorage.getItem(LS_SET) || 'null'); if (s0 && typeof s0 === 'object') settings = cleanSettings(s0); } catch (e) {}
  function inRange(v, lo, hi, def) { v = num(v); return v != null && v >= lo && v <= hi ? v : def; }
  function cleanSettings(o) {
    var f = num(o.fcmax), r = num(o.rest);
    return {
      fcmax: f && f >= 140 && f <= 230 ? Math.round(f) : 191,
      rest: [60, 90, 120, 150, 180, 240].indexOf(r) >= 0 ? r : 120,
      kcal: Math.round(inRange(o.kcal, 1000, 5000, 1950)),
      water: inRange(o.water, 0.5, 8, 3),
      sleep: Math.round(inRange(o.sleep, 240, 720, 450)),
      screen: Math.round(inRange(o.screen, 15, 900, 300)),
      coffee: Math.round(inRange(o.coffee, 0, 10, 3))
    };
  }
  function applyGoals() { ['kcal', 'water', 'sleep', 'screen', 'coffee'].forEach(function (k) { GOALS[k] = settings[k]; }); }
  applyGoals();
  function saveGoals() {
    applyGoals();
    try { localStorage.setItem(LS_GOALS, JSON.stringify(bodyGoals)); localStorage.setItem(LS_SET, JSON.stringify(settings)); } catch (e) {}
    if (db) db.collection('days').doc('goals').set({ body: bodyGoals, settings: settings }).then(function () {}, function () { setSync('error'); });
  }
  function remainTxt(k, v) {
    var g = bodyGoals[k], def = bodyDef(k);
    if (g == null || v == null) return '';
    var diff = v - g, reached = def.down ? diff <= 0 : diff >= 0;
    if (reached) return '<span style="color:var(--good);font-weight:600">Objectif atteint</span>';
    return 'Reste ' + fmtD(Math.abs(diff)) + ' ' + def.unit;
  }
  function bodyDef(k) { return BODY.filter(function (b) { return b.k === k; })[0]; }
  function bodySeries(k) {
    return Object.keys(days).sort().filter(function (d) { return days[d][k] != null; }).map(function (d) { return { x: d, y: days[d][k] }; });
  }
  function lastBody(k, before) {
    var keys = Object.keys(days).filter(function (d) { return d < before && days[d][k] != null; }).sort();
    return keys.length ? { date: keys[keys.length - 1], v: days[keys[keys.length - 1]][k] } : null;
  }
  function fatKg(d) { return d.weight != null && d.fat != null ? d.weight * d.fat / 100 : null; }
  function deltaTxt(delta, def) {
    if (delta == null || Math.abs(delta) < 0.05) return '<span class="sum">=</span>';
    var good = def.down ? delta < 0 : delta > 0;
    return '<span style="color:var(--' + (good ? 'good' : 'bad') + ');font-weight:600">' + (delta > 0 ? '+' : '−') + fmtD(Math.abs(delta)) + ' ' + def.unit + '</span>';
  }

  /* ---------- calculs muscu ---------- */
  function setDone(x) { return x.r != null && x.r > 0; }
  function exoStats(e) {
    var n = 0, ton = 0, top = null;
    e.sets.forEach(function (x) {
      if (!setDone(x)) return;
      n++; ton += (x.w || 0) * x.r;
      if (x.w != null && (!top || x.w > top.w || (x.w === top.w && x.r > top.r))) top = { w: x.w, r: x.r };
    });
    return { n: n, ton: ton, top: top, e1rm: top ? top.w * (1 + top.r / 30) : null };
  }
  function sessionStats(s) {
    var n = 0, ton = 0;
    s.exos.forEach(function (e) { var st = exoStats(e); n += st.n; ton += st.ton; });
    return { n: n, ton: ton };
  }
  /* Dernière séance où le mouvement a été fait, avant la date donnée. */
  function lastFor(move, before) {
    var keys = Object.keys(days).filter(function (k) { return k < before; }).sort().reverse();
    for (var i = 0; i < keys.length; i++) {
      var d = days[keys[i]];
      for (var j = 0; j < d.sports.length; j++) {
        var ex = d.sports[j].exos;
        for (var k = 0; k < ex.length; k++) {
          if (ex[k].move === move && exoStats(ex[k]).n) return { date: keys[i], exo: ex[k] };
        }
      }
    }
    return null;
  }
  function recordFor(move, before) {
    var best = null;
    Object.keys(days).forEach(function (k) {
      if (k >= before) return;
      days[k].sports.forEach(function (s) { s.exos.forEach(function (e) {
        if (e.move !== move) return;
        var st = exoStats(e);
        if (st.top && (best == null || st.top.w > best)) best = st.top.w;
      }); });
    });
    return best;
  }
  function moveHistory(move) {
    var out = [];
    Object.keys(days).sort().forEach(function (k) {
      days[k].sports.forEach(function (s) { s.exos.forEach(function (e) {
        if (e.move !== move) return;
        var st = exoStats(e);
        if (st.n) out.push({ date: k, exo: e, st: st });
      }); });
    });
    return out;
  }

  /* ---------- stockage : IndexedDB + localStorage ---------- */
  var idb = null, idbReady = null, lastSave = null;
  function openIdb() {
    if (idbReady) return idbReady;
    idbReady = new Promise(function (res) {
      try {
        var req = indexedDB.open('ced-routines', 1);
        req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
        req.onsuccess = function () { idb = req.result; res(idb); };
        req.onerror = function () { res(null); };
        req.onblocked = function () { res(null); };
      } catch (e) { res(null); }
    });
    return idbReady;
  }
  function idbGet() {
    return openIdb().then(function (d) {
      if (!d) return null;
      return new Promise(function (res) {
        try { var r = d.transaction('kv', 'readonly').objectStore('kv').get('days'); r.onsuccess = function () { res(r.result || null); }; r.onerror = function () { res(null); }; }
        catch (e) { res(null); }
      });
    });
  }
  function idbPut(obj) {
    return openIdb().then(function (d) {
      if (!d) return false;
      return new Promise(function (res) {
        try { var tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(obj, 'days'); tx.oncomplete = function () { res(true); }; tx.onerror = tx.onabort = function () { res(false); }; }
        catch (e) { res(false); }
      });
    });
  }
  function snapshot() {
    var out = {};
    Object.keys(days).forEach(function (k) { if (hasData(days[k])) out[k] = JSON.parse(JSON.stringify(days[k])); });
    return out;
  }
  function persistLocal() {
    var out = snapshot(), okLs = false;
    try { localStorage.setItem(LS_KEY, JSON.stringify(out)); okLs = true; } catch (e) {}
    idbPut(out).then(function (okIdb) {
      if (okIdb || okLs) { lastSave = new Date(); if (!db) setSync('local'); }
      else setSync('fail');
    });
  }
  function loadLocal() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      Object.keys(o).forEach(function (k) { days[k] = normalize(o[k], k); });
    } catch (e) {}
  }

  /* ---------- synchro ---------- */
  var SYNC_TXT = {
    local: "Enregistré sur ce téléphone",
    fail: "Enregistrement impossible : vérifie que tu n'es pas en navigation privée",
    loading: "Synchronisation…", ok: "Enregistré", pending: "Enregistrement…",
    slow: "Synchronisation lente, données de cet appareil affichées",
    error: "Synchronisation impossible, données gardées sur cet appareil"
  };
  function setSync(k) {
    var t = SYNC_TXT[k] || '';
    if (k === 'local' && lastSave) t += ' à ' + lastSave.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    $('#sync').textContent = t;
  }
  var timers = {}, inflight = {}, dirty = {};
  function touch(date) {
    persistLocal();
    backupInfo();
    if (!db) { setSync('local'); return; }
    clearTimeout(timers[date]);
    timers[date] = setTimeout(function () { flush(date); }, 600);
    setSync('pending');
  }
  function flush(date) {
    delete timers[date];
    if (inflight[date]) { dirty[date] = true; return; }
    inflight[date] = true;
    var body = JSON.parse(JSON.stringify(days[date]));
    db.collection('days').doc(date).set(body).then(function () {
      setSync(Object.keys(timers).length ? 'pending' : 'ok');
    }, function () { setSync('error'); }).then(function () {
      inflight[date] = false;
      if (dirty[date]) { dirty[date] = false; flush(date); }
    });
  }
  function isTyping() { var a = document.activeElement; return a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName); }
  function onDaysSnap(snap) {
    var changed = false;
    snap.docs.forEach(function (d) {
      var date = d.id;
      if (date === 'races') {
        var rd = d.data(), nr = cleanRaces((rd && rd.list) || []);
        if (JSON.stringify(nr) !== JSON.stringify(races)) { races = nr; try { localStorage.setItem(LS_RACES, JSON.stringify(races)); } catch (e) {} changed = true; }
        return;
      }
      if (date === 'goals') {
        var gd = d.data(), ng = cleanGoals((gd && gd.body) || {});
        if (JSON.stringify(ng) !== JSON.stringify(bodyGoals)) { bodyGoals = ng; try { localStorage.setItem(LS_GOALS, JSON.stringify(bodyGoals)); } catch (e) {} changed = true; }
        if (gd && gd.settings) {
          var nset = cleanSettings(gd.settings);
          if (JSON.stringify(nset) !== JSON.stringify(settings)) { settings = nset; applyGoals(); try { localStorage.setItem(LS_SET, JSON.stringify(settings)); } catch (e) {} changed = true; renderSettings(); }
        }
        return;
      }
      if (timers[date] || inflight[date]) return;
      var inc = d.data();
      if (!inc) return;
      var norm = normalize(inc, date);
      if (JSON.stringify(norm) !== JSON.stringify(days[date] || emptyDay(date))) { days[date] = norm; changed = true; }

  /* ---------- vue Progrès ---------- */
  function chart(pts, opts) {
    opts = opts || {};
    var W = 320, H = 200, pl = 34, pr = 12, pt = 16, pb = 26, w = W - pl - pr, h = H - pt - pb;
    var vals = [];
    pts.forEach(function (p) { vals.push(p.y); if (p.y2 != null) vals.push(p.y2); });
    if (opts.target != null) vals.push(opts.target);
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    if (mn === mx) { mn -= 5; mx += 5; } else { var m = (mx - mn) * .15; mn -= m; mx += m; }
    var n = pts.length;
    function X(i) { return pl + (n === 1 ? w / 2 : w * i / (n - 1)); }
    function Y(v) { return pt + h - (v - mn) / (mx - mn) * h; }
    var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Évolution de la charge">';
    for (var k = 0; k < 4; k++) { var v = mn + (mx - mn) * k / 3, y = Y(v); s += '<line class="grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '"/><text class="ax" x="' + (pl - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + (mx - mn < 8 ? fmtD(v) : Math.round(v)) + '</text>'; }
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(i) + ' ' + Y(p.y); }).join(' ');
    var col = opts.color ? ' style="stroke:' + opts.color + '"' : '', fillc = opts.color ? ' style="fill:' + opts.color + '"' : '';
    if (opts.target != null) { var ty = Y(opts.target); s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + ty + '" y2="' + ty + '" style="stroke:var(--good);stroke-dasharray:5 4;stroke-width:1.5"/><text class="ax" x="' + (W - pr) + '" y="' + (ty - 5) + '" text-anchor="end" style="fill:var(--good)">objectif ' + fmtD(opts.target) + '</text>'; }
    if (n > 1) {
      s += '<path class="area"' + fillc + ' d="' + line + ' L' + X(n - 1) + ' ' + (pt + h) + ' L' + X(0) + ' ' + (pt + h) + ' Z"/>';
      if (pts[0].y2 != null) s += '<path class="ln2"' + (opts.avgColor ? ' style="stroke:' + opts.avgColor + '"' : '') + ' d="' + pts.map(function (p, i) { return (i ? 'L' : 'M') + X(i) + ' ' + Y(p.y2); }).join(' ') + '"/>';

    });

      if (s && s.exos.some(function (x) { return exoStats(x).n; }) && b.dataset.confirm !== '1') {
        b.dataset.confirm = '1'; b.textContent = '?'; b.setAttribute('aria-label', 'Toucher encore pour supprimer');
        setTimeout(function () { if (b.isConnected) { b.dataset.confirm = ''; b.textContent = '×'; } }, 2500);
        return;
      }
      d.sports = d.sports.filter(function (x) { return x.id !== b.dataset.id; });
      touch(cur); render();
    } else if (a === 'add-exo') {
      s = findSport(get(cur), b.dataset.sid); if (s) addExo(s, b.dataset.move);
    } else if (a === 'new-move') {
      s = findSport(get(cur), b.dataset.sid);
      var inp = document.getElementById('nm-' + b.dataset.sid), name = inp ? inp.value.trim() : '';
      if (!s || !name) return;
      if (allMoves().indexOf(name) < 0) { customMoves.push(name); saveCustomMoves(); }
      addExo(s, name);
    } else if (a === 'toggle-picker') {
      openPicker[b.dataset.sid] = !openPicker[b.dataset.sid]; render();
      if (openPicker[b.dataset.sid]) focusSel('#nm-' + b.dataset.sid);
    } else if (a === 'del-exo') {
      s = findSport(get(cur), b.dataset.sid);
      if (s) { s.exos = s.exos.filter(function (x) { return x.id !== b.dataset.eid; }); touch(cur); render(); }
    } else if (a === 'add-set') {
      s = findSport(get(cur), b.dataset.sid); ex = findExo(s, b.dataset.eid);
      if (!ex) return;
      var prev = ex.sets[ex.sets.length - 1];
      ex.sets.push({ w: prev ? prev.w : null, r: prev ? prev.r : null });
      touch(cur); render();
      focusSel('input[data-field="setR"][data-eid="' + ex.id + '"][data-i="' + (ex.sets.length - 1) + '"]');
    } else if (a === 'del-set') {
      s = findSport(get(cur), b.dataset.sid); ex = findExo(s, b.dataset.eid);
      if (ex) { ex.sets.splice(+b.dataset.i, 1); touch(cur); render(); }
    } else if (a === 'prog-move') { progMove = b.dataset.move; render(); }
    else if (a === 'rest') {
      if (b.dataset.v === 'stop') stopRest(); else { timer.end += +b.dataset.v * 1000; timer.total = Math.max(15, timer.total + +b.dataset.v); timer.done = false; tick(); }
    }
    else if (a === 'rest-dur') { settings.rest = +b.dataset.v; saveGoals(); renderSettings(); }
    else if (a === 'meal') {
      d = get(cur); var mi = +b.dataset.i, k = d.meals.indexOf(mi);
      if (k >= 0) d.meals.splice(k, 1); else d.meals.push(mi);
      d.meals.sort(); touch(cur); render();
    }
    else if (a === 'coffee') { d = get(cur); d.coffee = Math.max(0, (d.coffee || 0) + +b.dataset.d); touch(cur); render(); }
    else if (a === 'rf-new') { raceEdit = { name: '', date: '', dist: 'semi', km: null, goal: null, result: null, place: '', rank: '', notes: '' }; render(); window.scrollTo(0, 0); focusSel('#rf-name'); }
    else if (a === 'rf-edit') { var re0 = races.filter(function (x) { return x.id === b.dataset.id; })[0]; if (re0) { raceEdit = JSON.parse(JSON.stringify(re0)); render(); window.scrollTo(0, 0); } }
    else if (a === 'rf-dist') { readRaceForm(); raceEdit.dist = b.dataset.d; render(); }
    else if (a === 'rf-cancel') { raceEdit = null; render(); }
    else if (a === 'rf-del') { races = races.filter(function (x) { return x.id !== raceEdit.id; }); raceEdit = null; saveRaces(); render(); }
    else if (a === 'rf-save') {
      readRaceForm();
      if (!raceEdit.name || !raceEdit.date) { $('#rf-msg').textContent = 'Il faut au moins un nom et une date.'; return; }
      if (raceEdit.dist === 'autre' && !raceEdit.km) { $('#rf-msg').textContent = 'Indique la distance en km.'; return; }
      if (!raceEdit.id) { raceEdit.id = uid('r'); races.push(raceEdit); }
      else races = races.map(function (x) { return x.id === raceEdit.id ? raceEdit : x; });
      raceEdit = null; saveRaces(); render();
    }
    else if (a === 'goto-race') {
      view = 'race'; var rr = races.filter(function (x) { return x.date === cur; })[0];
      raceEdit = rr ? JSON.parse(JSON.stringify(rr)) : null; render(); window.scrollTo(0, 0);
      if (rr && !rr.result) focusSel('#rf-result-h');
    }
    else if (a === 'plan-new') { planEdit = { date: b.dataset.date, type: null, min: null, note: '' }; render(); }
    else if (a === 'plan-edit') {
      var pe = plannedFor(b.dataset.date).filter(function (x) { return x.id === b.dataset.pid; })[0];
      if (pe) { planEdit = { date: b.dataset.date, id: pe.id, type: pe.type, min: pe.min, note: pe.note }; render(); }
    }
    else if (a === 'plan-type') {
      planEdit.type = b.dataset.type; planEdit.min = num($('#pe-min').value); planEdit.note = $('#pe-note').value; render();
      focusSel('#pe-min');
    }
    else if (a === 'plan-cancel') { planEdit = null; render(); }
    else if (a === 'plan-save') {
      if (!planEdit || !planEdit.type) return;
      var pdd = get(planEdit.date), item = { id: planEdit.id || uid('p'), type: planEdit.type, min: num($('#pe-min').value), note: $('#pe-note').value.trim().slice(0, 120) };
      var ix = pdd.plan.map(function (x) { return x.id; }).indexOf(item.id);
      if (ix >= 0) pdd.plan[ix] = item; else pdd.plan.push(item);
      touch(planEdit.date); planEdit = null; render();
    }
    else if (a === 'plan-del') {
      var pd = get(b.dataset.date);
      pd.plan = pd.plan.filter(function (x) { return x.id !== b.dataset.pid; });
      touch(b.dataset.date); render();
    }
    else if (a === 'plan-copy') {
      var dir = +b.dataset.dir, ws0 = weekStart(cur), n = 0;
      for (var di = 0; di < 7; di++) {
        var from = dir > 0 ? addDays(ws0, di) : addDays(ws0, di - 7), to = dir > 0 ? addDays(ws0, di + 7) : addDays(ws0, di);
        var src = plannedFor(from);
        if (!src.length) continue;
        var dst = get(to);
        src.forEach(function (x) { dst.plan.push({ id: uid('p'), type: x.type, min: x.min, note: x.note }); n++; });
        touch(to);
      }
      if (dir > 0) { cur = addDays(cur, 7); }
      render();
      var pm = $('#plan-msg'); if (pm) pm.textContent = plural(n, 'séance') + ' ' + (n > 1 ? 'copiées' : 'copiée') + (dir > 0 ? ' sur cette semaine.' : '.');
    }
    else if (a === 'plan-add') {
      d = get(cur);
      var pid = uid('s');
      d.sports.push({ id: pid, type: b.dataset.type, min: num(b.dataset.min), km: null, hr: null, exos: [] });
      touch(cur); render();
      var ps = findSport(d, pid);
      if (sportDef(ps.type).fam !== 'muscu') focusSel('input[data-field="sportKm"][data-sid="' + pid + '"]');
    }
    else if (a === 'use-tpl') {
      s = findSport(get(cur), b.dataset.sid);
      var tp = s && lastSessionOfType(s.type, cur);
      if (!tp) return;
      tp.s.exos.forEach(function (x) {
        var n = Math.max(1, x.sets.filter(setDone).length), sets = [];
        for (var i = 0; i < n; i++) sets.push({ w: null, r: null });
        s.exos.push({ id: uid('e'), move: x.move, rir: null, sets: sets });
      });
      if (!s.min && tp.s.min) s.min = tp.s.min;
      touch(cur); render();
      if (s.exos[0]) focusSel('input[data-field="setW"][data-eid="' + s.exos[0].id + '"][data-i="0"]');
    }
    else if (a === 'export') { $('#btn-export').click(); }
    else if (a === 'copy-bilan') {
      var txt = bilanText(), msg = $('#bilan-msg');
      try {
        navigator.clipboard.writeText(txt).then(function () { msg.textContent = 'Bilan copié.'; }, function () { msg.textContent = 'Copie impossible : sélectionne le texte et copie-le.'; });
      } catch (err) { msg.textContent = 'Copie impossible : sélectionne le texte et copie-le.'; }
    }
    else if (a === 'prog-tab') { progTab = b.dataset.tab; render(); }
    else if (a === 'body-metric') { bodyMetric = b.dataset.k; render(); }
  });

  /* ---------- minuteur de repos ---------- */
  var timer = { end: 0, total: 0, iv: null, done: false };
  var actx = null;
  function unlockAudio() {
    try {
      if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
      if (actx && actx.state === 'suspended') actx.resume();
    } catch (e) {}
  }
  document.addEventListener('pointerdown', unlockAudio, { passive: true });
  function ding() {
    try { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); } catch (e) {}
    try {
      if (!actx) return;
      [0, 0.25, 0.5].forEach(function (t) {
        var o = actx.createOscillator(), g = actx.createGain(), at = actx.currentTime + t;
        o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
        g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.35, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.18);
        o.start(at); o.stop(at + 0.2);
      });
    } catch (e) {}
  }
  function fmtClock(sec) { return Math.floor(sec / 60) + ':' + pad(sec % 60); }
  function startRest() {
    timer.total = settings.rest; timer.end = Date.now() + settings.rest * 1000; timer.done = false;
    $('#rest').hidden = false; $('#rest').classList.remove('done'); document.body.classList.add('has-rest');
    if (!timer.iv) timer.iv = setInterval(tick, 250);
    tick();
  }
  function tick() {
    var left = Math.max(0, Math.ceil((timer.end - Date.now()) / 1000));
    $('#rest-time').textContent = fmtClock(left);
    $('#rest-fill').style.width = Math.round((1 - left / Math.max(1, timer.total)) * 100) + '%';
    if (left === 0 && !timer.done) {
      timer.done = true; $('#rest').classList.add('done'); $('#rest-lbl').textContent = 'Série suivante !'; ding();
      setTimeout(function () { if (timer.done) stopRest(); }, 15000);
    } else if (left > 0) { $('#rest').classList.remove('done'); $('#rest-lbl').textContent = 'Repos'; }
  }
  function stopRest() {
    clearInterval(timer.iv); timer.iv = null; timer.done = false;
    $('#rest').hidden = true; document.body.classList.remove('has-rest');
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && timer.iv) tick(); });

  /* ---------- réglages ---------- */
  function renderSettings() {
    var el = $('#settings');
    function gRow(k, label, unit, v, step, hint) {
      return '<div class="m-row" style="justify-content:space-between"><div><span class="sub">' + label + '</span>' + (hint ? '<span class="goal">' + hint + '</span>' : '') + '</div>' +
        '<label class="field mini"><span class="sr">' + label + '</span><input data-goal="' + k + '" type="number" inputmode="decimal" min="0" step="' + step + '" value="' + v + '"><span class="unit">' + unit + '</span></label></div>';
    }
    el.innerHTML = '<div class="m-head"><div><h3>Objectifs du jour</h3><span class="goal">Ils servent au score sur 5 et aux pastilles</span></div></div>' +
      gRow('kcal', 'Calories max', 'kcal', settings.kcal, 10) +
      gRow('water', 'Hydratation min', 'L', settings.water, 0.25) +
      gRow('sleep', 'Sommeil min', 'h', Math.round(settings.sleep / 60 * 100) / 100, 0.25, '7,5 = 7 h 30') +
      gRow('screen', "Temps d'écran max", 'h', Math.round(settings.screen / 60 * 100) / 100, 0.25, '1,5 = 1 h 30') +
      gRow('coffee', 'Cafés max', 'cafés', settings.coffee, 1) +
      '<div style="border-top:1px solid var(--line);margin:4px 0 0"></div>' +
      '<div class="m-head"><div><h3>Réglages</h3><span class="goal">FC max pour les zones · durée du repos entre séries</span></div></div>' +
      '<div class="m-row"><span class="sub" style="flex:1">FC max</span><label class="field mini"><span class="sr">FC max</span><input data-field="fcmax" type="number" inputmode="numeric" min="140" max="230" step="1" value="' + settings.fcmax + '"><span class="unit">bpm</span></label></div>' +
      '<div class="sub">Repos entre séries</div><div class="chips">' + [60, 90, 120, 150, 180, 240].map(function (v) {
        return '<button class="chip sm" data-action="rest-dur" data-v="' + v + '" aria-pressed="' + (settings.rest === v) + '">' + fmtClock(v) + '</button>';
      }).join('') + '</div><p class="note" id="set-msg" role="status"></p>';
  }
  $('#settings').addEventListener('change', function (e) {
    var gk = e.target.dataset.goal;
    if (gk) {
      var v0 = num(e.target.value), o = JSON.parse(JSON.stringify(settings));
      if (v0 != null) o[gk] = gk === 'sleep' || gk === 'screen' ? v0 * 60 : v0;
      settings = cleanSettings(o); saveGoals(); renderSettings(); render();
      var m = $('#set-msg'); if (m) m.textContent = 'Objectif enregistré.';
      return;
    }
    if (e.target.dataset.field !== 'fcmax') return;
    var v = num(e.target.value);
    if (v && v >= 140 && v <= 230) { settings.fcmax = Math.round(v); saveGoals(); render(); }
    renderSettings();
  });

  /* ---------- sauvegarde ---------- */
  var LS_EXPORT = 'ced-routines-last-export';
  function backupMsg(t) { $('#backup-msg').textContent = t; }
  function backupInfo() {
    var n = Object.keys(days).filter(function (k) { return hasData(days[k]); }).length, last = null;
    try { last = localStorage.getItem(LS_EXPORT); } catch (e) {}
    var t = plural(n, 'jour') + (n > 1 ? ' enregistrés' : ' enregistré');
    if (last) t += ' · dernière copie le ' + parse(last).toLocaleDateString('fr-FR');
    backupMsg(t);
  }
  function markExported() { try { localStorage.setItem(LS_EXPORT, todayStr()); } catch (e) {} backupInfo(); if (view === 'day' && !isTyping()) render(); }
  $('#btn-export').addEventListener('click', function () {
    var out = snapshot();
    var name = 'routines-' + todayStr() + '.json';
    var text = JSON.stringify({ app: 'routines', version: 2, exported: new Date().toISOString(), moves: customMoves, goals: bodyGoals, settings: settings, races: races, days: out }, null, 2);
    var file = null;
    try { file = new File([text], name, { type: 'application/json' }); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).then(markExported, function () {});
      return;
    }
    var copied = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { backupMsg('Copie placée dans le presse-papiers : colle-la dans un fichier .json.'); markExported(); copied = true; }, download);
        return;
      }
    } catch (e) {}
    download();
    function download() {
      if (copied) return;
      var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      var a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      markExported();
    }
  });
  $('#btn-import').addEventListener('click', function () { $('#file-import').click(); });
  $('#file-import').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var o = JSON.parse(r.result), src = o && o.days ? o.days : o, n = 0;
        if (o && Array.isArray(o.moves)) { o.moves.forEach(function (m) { if (typeof m === 'string' && customMoves.indexOf(m) < 0) customMoves.push(m); }); saveCustomMoves(); }
        if (o && Array.isArray(o.races)) { races = cleanRaces(o.races); saveRaces(); }
        if (o && o.settings && typeof o.settings === 'object') { settings = cleanSettings(o.settings); applyGoals(); }
        if (o && o.goals && typeof o.goals === 'object') { bodyGoals = cleanGoals(o.goals); }
        saveGoals(); renderSettings();
        Object.keys(src).forEach(function (k) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !src[k] || typeof src[k] !== 'object') return;
          days[k] = normalize(src[k], k); n++;
          if (db) touch(k);
        });
        if (!n) { backupMsg("Ce fichier ne contient aucune journée."); return; }
        persistLocal(); render();
        backupMsg(plural(n, 'jour') + (n > 1 ? ' importés.' : ' importé.'));
      } catch (err) { backupMsg("Fichier illisible : choisis une copie exportée depuis cette appli."); }
    };
    r.onerror = function () { backupMsg("Impossible de lire ce fichier."); };
    r.readAsText(f);
    e.target.value = '';
  });

  /* ---------- démarrage ---------- */
  loadLocal();
  renderSettings();
  render();
  setSync('local');
  backupInfo();
  idbGet().then(function (stored) {
    if (!stored || typeof stored !== 'object') { persistLocal(); return; }
    var changed = false;
    Object.keys(stored).forEach(function (k) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      if (!days[k] || !hasData(days[k])) { days[k] = normalize(stored[k], k); changed = true; }
    });
    if (changed) { if (isTyping()) needsRender = true; else render(); backupInfo(); }
    persistLocal();
  });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') persistLocal(); });
  window.addEventListener('pagehide', persistLocal);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.claude) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('saiyan-sw.js', { scope: './Saiyan.html' }).catch(function () {}); });
  }
  try {
    if (window.claude && window.claude.use) {
      window.claude.use('db').then(function (handle) {
        if (!handle) return;
        db = handle;
        setSync('loading');
        loadTimer = setTimeout(function () { setSync('slow'); }, 10000);
        db.collection('days').onSnapshot(onDaysSnap, function () { clearTimeout(loadTimer); setSync('error'); });
      }, function () {});
    }
  } catch (err) {}
})();
</script>
</body>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0d0f12" />
<title>Tracker Muscu — Ced</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #0d0f12; }
  input, textarea, button { font-family: 'Inter', system-ui, sans-serif; }
  input::placeholder, textarea::placeholder { color: #555c68; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.6); }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const C = {
  bg: "#0d0f12",
  panel: "#16191f",
  panel2: "#1d2128",
  line: "#272c35",
  text: "#f2f4f7",
  dim: "#8b93a1",
  accent: "#ff7a1a",
  accentDim: "#cc5f10",
  danger: "#ff5757",
  blue: "#4da3ff",
};

const FONT_DISPLAY = "'Archivo Black', 'Arial Black', sans-serif";
const FONT_BODY = "'Inter', system-ui, sans-serif";
const STORAGE_KEY = "ced_muscu_v1";

const DEFAULT_MOVES = [
  "Bench Press", "Back Squat", "Deadlift", "Push Press",
  "Bent Rows", "Strict Pull-ups", "Front Squat",
];

function todayISO() { return new Date().toISOString().slice(0, 10); }
function fmtDate(iso) { const [y,m,d] = iso.split("-"); return `${d}/${m}`; }

// ── Persistance via localStorage ──
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { moves: [...DEFAULT_MOVES], entries: [] };
}
function saveData(d) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch (e) {}
}

function App() {
  const [data, setData] = useState(loadData);
  const [tab, setTab] = useState("log");
  const [selectedMove, setSelectedMove] = useState(data.moves[0] || null);

  function persist(next) { setData(next); saveData(next); }

  return (
    <div style={styles.app}>
      <header style={styles.header}>
        <div>
          <div style={styles.kicker}>SUIVI FORCE</div>
          <h1 style={styles.title}>TRACKER<span style={{color: C.accent}}>.</span></h1>
        </div>
        <div style={styles.headerStat}>
          <div style={styles.headerStatNum}>{data.entries.length}</div>
          <div style={styles.headerStatLabel}>séries loggées</div>
        </div>
      </header>

      <nav style={styles.nav}>
        {[["log","Saisir"],["history","Historique"],["progress","Évolution"]].map(([k,label]) => (
          <button key={k} onClick={() => setTab(k)}
            style={{...styles.navBtn, ...(tab===k ? styles.navBtnActive : {})}}>
            {label}
          </button>
        ))}
      </nav>

      <main style={styles.main}>
        {tab === "log" && <LogTab data={data} persist={persist} />}
        {tab === "history" && <HistoryTab data={data} persist={persist} />}
        {tab === "progress" && <ProgressTab data={data} selectedMove={selectedMove} setSelectedMove={setSelectedMove} />}
      </main>
    </div>
  );
}

function LogTab({ data, persist }) {
  const [move, setMove] = useState(data.moves[0] || "");
  const [date, setDate] = useState(todayISO());
  const [weight, setWeight] = useState("");
  const [reps, setReps] = useState("");
  const [sets, setSets] = useState("");
  const [rir, setRir] = useState("");
  const [note, setNote] = useState("");
  const [newMove, setNewMove] = useState("");
  const [adding, setAdding] = useState(false);
  const [flash, setFlash] = useState(false);

  const lastForMove = useMemo(() => {
    const arr = data.entries.filter(e => e.move === move).sort((a,b) => a.date < b.date ? 1 : -1);
    return arr[0] || null;
  }, [data.entries, move]);

  function addMove() {
    const name = newMove.trim();
    if (!name) return;
    if (data.moves.includes(name)) { setMove(name); setNewMove(""); setAdding(false); return; }
    persist({ ...data, moves: [...data.moves, name] });
    setMove(name); setNewMove(""); setAdding(false);
  }

  function save() {
    if (!move || weight === "" || reps === "") return;
    const entry = {
      id: Date.now(), move, date,
      weight: parseFloat(weight), reps: parseInt(reps,10),
      sets: sets === "" ? 1 : parseInt(sets,10),
      rir: rir === "" ? null : parseInt(rir,10),
      note: note.trim(),
    };
    persist({ ...data, entries: [...data.entries, entry] });
    setWeight(""); setReps(""); setSets(""); setRir(""); setNote("");
    setFlash(true); setTimeout(() => setFlash(false), 900);
  }

  return (
    <div style={styles.stack}>
      <div style={styles.card}>
        <div style={styles.cardLabel}>MOUVEMENT</div>
        <div style={styles.moveGrid}>
          {data.moves.map(m => (
            <button key={m} onClick={() => setMove(m)}
              style={{...styles.chip, ...(move===m ? styles.chipActive : {})}}>{m}</button>
          ))}
          <button onClick={() => setAdding(a => !a)} style={{...styles.chip, ...styles.chipAdd}}>+ nouveau</button>
        </div>
        {adding && (
          <div style={styles.addRow}>
            <input value={newMove} onChange={e => setNewMove(e.target.value)}
              placeholder="Nom du mouvement…" style={styles.input}
              onKeyDown={e => e.key === "Enter" && addMove()} />
            <button onClick={addMove} style={styles.smallBtn}>Ajouter</button>
          </div>
        )}
      </div>

      {lastForMove && (
        <div style={styles.lastRef}>
          <span style={{color: C.dim}}>Dernière fois&nbsp;:</span>{" "}
          <span style={{color: C.accent, fontWeight: 700}}>{lastForMove.weight} kg</span>{" "}
          × {lastForMove.reps}{lastForMove.sets ? ` × ${lastForMove.sets} séries` : ""}
          {lastForMove.rir != null ? ` · RIR ${lastForMove.rir}` : ""}
          <span style={{color: C.dim}}> ({fmtDate(lastForMove.date)})</span>
        </div>
      )}

      <div style={styles.card}>
        <div style={styles.cardLabel}>SÉANCE</div>
        <div style={styles.fieldRow}>
          <Field label="Date">
            <input type="date" value={date} onChange={e => setDate(e.target.value)} style={styles.input} />
          </Field>
        </div>
        <div style={styles.grid2}>
          <Field label="Charge (kg)">
            <input type="number" inputMode="decimal" value={weight} onChange={e => setWeight(e.target.value)} placeholder="40" style={styles.inputBig} />
          </Field>
          <Field label="Reps">
            <input type="number" inputMode="numeric" value={reps} onChange={e => setReps(e.target.value)} placeholder="10" style={styles.inputBig} />
          </Field>
        </div>
        <div style={styles.grid2}>
          <Field label="Séries">
            <input type="number" inputMode="numeric" value={sets} onChange={e => setSets(e.target.value)} placeholder="4" style={styles.input} />
          </Field>
          <Field label="RIR (reps en réserve)">
            <input type="number" inputMode="numeric" value={rir} onChange={e => setRir(e.target.value)} placeholder="2" style={styles.input} />
          </Field>
        </div>
        <Field label="Ressenti / commentaire">
          <textarea value={note} onChange={e => setNote(e.target.value)}
            placeholder="Propre, descente contrôlée… facile, à monter…" rows={2} style={styles.textarea} />
        </Field>
        <button onClick={save} style={{...styles.saveBtn, ...(flash ? {background: C.accentDim} : {})}}>
          {flash ? "✓ Enregistré" : "Enregistrer la série"}
        </button>
      </div>
    </div>
  );
}

function HistoryTab({ data, persist }) {
  const [filter, setFilter] = useState("Tous");
  const sorted = useMemo(() => {
    let arr = [...data.entries];
    if (filter !== "Tous") arr = arr.filter(e => e.move === filter);
    return arr.sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id);
  }, [data.entries, filter]);

  function del(id) { persist({ ...data, entries: data.entries.filter(e => e.id !== id) }); }

  if (data.entries.length === 0)
    return <Empty text="Aucune série enregistrée pour l'instant. Va dans Saisir pour commencer." />;

  return (
    <div style={styles.stack}>
      <div style={styles.moveGrid}>
        {["Tous", ...data.moves].map(m => (
          <button key={m} onClick={() => setFilter(m)}
            style={{...styles.chip, ...(filter===m ? styles.chipActive : {})}}>{m}</button>
        ))}
      </div>
      {sorted.map(e => (
        <div key={e.id} style={styles.histRow}>
          <div style={{flex: 1}}>
            <div style={styles.histMove}>{e.move}</div>
            <div style={styles.histMeta}>
              <span style={styles.histWeight}>{e.weight} kg</span> × {e.reps}
              {e.sets ? ` × ${e.sets}` : ""}{e.rir != null ? ` · RIR ${e.rir}` : ""}
              <span style={{color: C.dim}}> · {fmtDate(e.date)}</span>
            </div>
            {e.note && <div style={styles.histNote}>“{e.note}”</div>}
          </div>
          <button onClick={() => del(e.id)} style={styles.delBtn}>✕</button>
        </div>
      ))}
    </div>
  );
}

function ProgressTab({ data, selectedMove, setSelectedMove }) {
  const move = selectedMove || data.moves[0];
  const series = useMemo(() => {
    const byDate = {};
    data.entries.filter(e => e.move === move).forEach(e => {
      if (!byDate[e.date] || e.weight > byDate[e.date].weight)
        byDate[e.date] = { weight: e.weight, reps: e.reps };
    });
    return Object.entries(byDate)
      .map(([date, v]) => ({ date: fmtDate(date), rawDate: date, ...v }))
      .sort((a,b) => a.rawDate < b.rawDate ? -1 : 1);
  }, [data.entries, move]);

  const stats = useMemo(() => {
    if (series.length === 0) return null;
    const first = series[0].weight, last = series[series.length-1].weight;
    const max = Math.max(...series.map(s => s.weight));
    return { first, last, max, diff: last - first };
  }, [series]);

  return (
    <div style={styles.stack}>
      <div style={styles.moveGrid}>
        {data.moves.map(m => (
          <button key={m} onClick={() => setSelectedMove(m)}
            style={{...styles.chip, ...(move===m ? styles.chipActive : {})}}>{m}</button>
        ))}
      </div>
      {series.length === 0 ? (
        <Empty text={`Aucune donnée pour ${move}. Enregistre des séries pour voir la courbe.`} />
      ) : (
        <>
          {stats && (
            <div style={styles.statRow}>
              <Stat label="Départ" value={`${stats.first} kg`} />
              <Stat label="Actuel" value={`${stats.last} kg`} color={C.accent} />
              <Stat label="Record" value={`${stats.max} kg`} color={C.blue} />
              <Stat label="Évolution" value={`${stats.diff>=0?"+":""}${stats.diff} kg`} color={stats.diff>=0 ? C.accent : C.danger} />
            </div>
          )}
          <div style={{...styles.card, padding: 16}}>
            <div style={styles.cardLabel}>CHARGE — {move}</div>
            <SvgChart series={series} />
          </div>
        </>
      )}
    </div>
  );
}

function SvgChart({ series }) {
  const [hover, setHover] = useState(null);
  const W = 320, H = 240, padL = 38, padR = 14, padT = 18, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const weights = series.map(s => s.weight);
  let min = Math.min(...weights), max = Math.max(...weights);
  if (min === max) { min -= 5; max += 5; } else { const m = (max-min)*0.15; min -= m; max += m; }
  const range = max - min || 1;

  const n = series.length;
  const x = i => padL + (n === 1 ? plotW/2 : (plotW * i) / (n - 1));
  const y = w => padT + plotH - ((w - min) / range) * plotH;

  const pts = series.map((s, i) => ({ ...s, cx: x(i), cy: y(s.weight) }));
  const linePath = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${p.cx} ${p.cy}`).join(" ");
  const areaPath = `${linePath} L ${pts[pts.length-1].cx} ${padT+plotH} L ${pts[0].cx} ${padT+plotH} Z`;

  // 4 graduations Y
  const yTicks = [0,1,2,3].map(k => { const v = min + (range*k)/3; return { v, py: y(v) }; });

  return (
    <div style={{width: "100%"}}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width: "100%", height: "auto", display: "block"}}>
        <defs>
          <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={C.accent} stopOpacity="0.28" />
            <stop offset="100%" stopColor={C.accent} stopOpacity="0" />
          </linearGradient>
        </defs>
        {yTicks.map((t, i) => (
          <g key={i}>
            <line x1={padL} y1={t.py} x2={W-padR} y2={t.py} stroke={C.line} strokeDasharray="3 3" />
            <text x={padL-8} y={t.py+4} fill={C.dim} fontSize="10" textAnchor="end" fontFamily={FONT_BODY}>
              {Math.round(t.v)}
            </text>
          </g>
        ))}
        {n > 1 && <path d={areaPath} fill="url(#fillGrad)" />}
        <path d={linePath} fill="none" stroke={C.accent} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
        {pts.map((p, i) => (
          <g key={i}>
            <circle cx={p.cx} cy={p.cy} r={hover===i ? 6 : 4} fill={C.accent} stroke={C.bg} strokeWidth="2" />
            <rect x={p.cx-16} y={padT} width="32" height={plotH} fill="transparent"
              onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}
              onTouchStart={() => setHover(i)} />
            {(i === 0 || i === n-1 || hover === i) && (
              <text x={p.cx} y={H-padB+16} fill={C.dim} fontSize="10" textAnchor="middle" fontFamily={FONT_BODY}>
                {p.date}
              </text>
            )}
          </g>
        ))}
        {hover != null && (
          <g>
            <rect x={Math.min(Math.max(pts[hover].cx-46, 2), W-94)} y={pts[hover].cy-38}
              width="92" height="28" rx="7" fill={C.panel2} stroke={C.line} />
            <text x={Math.min(Math.max(pts[hover].cx, 48), W-48)} y={pts[hover].cy-19}
              fill={C.text} fontSize="11" textAnchor="middle" fontFamily={FONT_BODY} fontWeight="700">
              {pts[hover].weight} kg · {pts[hover].reps} reps
            </text>
          </g>
        )}
      </svg>
    </div>
  );
}

function Field({ label, children }) {
  return <label style={styles.field}><span style={styles.fieldLabel}>{label}</span>{children}</label>;
}
function Stat({ label, value, color }) {
  return <div style={styles.stat}><div style={{...styles.statValue, color: color || C.text}}>{value}</div><div style={styles.statLabel}>{label}</div></div>;
}
function Empty({ text }) {
  return <div style={styles.empty}><div style={{fontSize: 32, marginBottom: 12}}>🏋️</div>{text}</div>;
}

const styles = {
  app: { minHeight: "100vh", background: `radial-gradient(140% 100% at 50% 0%, #211a18 0%, ${C.bg} 55%)`, color: C.text, fontFamily: FONT_BODY, maxWidth: 560, margin: "0 auto", display: "flex", flexDirection: "column", paddingBottom: 40 },
  header: { display: "flex", alignItems: "flex-end", justifyContent: "space-between", padding: "28px 20px 18px" },
  kicker: { fontSize: 11, letterSpacing: 3, color: C.accent, fontWeight: 700, marginBottom: 4 },
  title: { margin: 0, fontFamily: FONT_DISPLAY, fontSize: 38, letterSpacing: -1, lineHeight: 0.9 },
  headerStat: { textAlign: "right" },
  headerStatNum: { fontFamily: FONT_DISPLAY, fontSize: 26, color: C.text, lineHeight: 1 },
  headerStatLabel: { fontSize: 10, color: C.dim, letterSpacing: 1, marginTop: 2 },
  nav: { display: "flex", gap: 6, padding: "0 20px", marginBottom: 16 },
  navBtn: { flex: 1, padding: "11px 0", background: "transparent", border: `1px solid ${C.line}`, borderRadius: 12, color: C.dim, fontWeight: 600, fontSize: 14, cursor: "pointer", transition: "all .15s" },
  navBtnActive: { background: C.accent, color: "#0d0f12", borderColor: C.accent },
  main: { padding: "0 16px" },
  stack: { display: "flex", flexDirection: "column", gap: 14 },
  card: { background: C.panel, border: `1px solid ${C.line}`, borderRadius: 18, padding: 18 },
  cardLabel: { fontSize: 11, letterSpacing: 2, color: C.dim, fontWeight: 700, marginBottom: 14 },
  moveGrid: { display: "flex", flexWrap: "wrap", gap: 8 },
  chip: { padding: "9px 14px", borderRadius: 999, border: `1px solid ${C.line}`, background: C.panel2, color: C.dim, fontSize: 13, fontWeight: 600, cursor: "pointer", transition: "all .15s" },
  chipActive: { background: C.accent, color: "#0d0f12", borderColor: C.accent },
  chipAdd: { borderStyle: "dashed", color: C.accent, background: "transparent" },
  addRow: { display: "flex", gap: 8, marginTop: 12 },
  field: { display: "flex", flexDirection: "column", gap: 6, flex: 1 },
  fieldLabel: { fontSize: 12, color: C.dim, fontWeight: 600 },
  fieldRow: { display: "flex", marginBottom: 12 },
  grid2: { display: "flex", gap: 12, marginBottom: 12 },
  input: { width: "100%", padding: "12px 14px", background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 12, color: C.text, fontSize: 15, outline: "none" },
  inputBig: { width: "100%", padding: "14px 14px", background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 12, color: C.text, fontSize: 24, fontWeight: 700, fontFamily: FONT_DISPLAY, outline: "none", textAlign: "center" },
  textarea: { width: "100%", padding: "12px 14px", background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 12, color: C.text, fontSize: 14, outline: "none", resize: "vertical", fontFamily: FONT_BODY },
  saveBtn: { width: "100%", padding: "16px", marginTop: 6, background: C.accent, color: "#0d0f12", border: "none", borderRadius: 14, fontSize: 16, fontWeight: 800, cursor: "pointer", transition: "all .2s" },
  smallBtn: { padding: "0 18px", background: C.accent, color: "#0d0f12", border: "none", borderRadius: 12, fontWeight: 700, fontSize: 14, cursor: "pointer", whiteSpace: "nowrap" },
  lastRef: { background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 16px", fontSize: 14 },
  histRow: { display: "flex", alignItems: "flex-start", gap: 12, background: C.panel, border: `1px solid ${C.line}`, borderRadius: 14, padding: "14px 16px" },
  histMove: { fontWeight: 700, fontSize: 15, marginBottom: 3 },
  histMeta: { fontSize: 14, color: C.text },
  histWeight: { color: C.accent, fontWeight: 700, fontFamily: FONT_DISPLAY },
  histNote: { fontSize: 13, color: C.dim, marginTop: 6, fontStyle: "italic" },
  delBtn: { background: "transparent", border: "none", color: C.dim, fontSize: 16, cursor: "pointer", padding: 4 },
  statRow: { display: "flex", gap: 8 },
  stat: { flex: 1, background: C.panel, border: `1px solid ${C.line}`, borderRadius: 14, padding: "14px 8px", textAlign: "center" },
  statValue: { fontFamily: FONT_DISPLAY, fontSize: 18, lineHeight: 1 },
  statLabel: { fontSize: 10, color: C.dim, marginTop: 5, letterSpacing: 0.5 },
  empty: { textAlign: "center", color: C.dim, padding: "60px 30px", fontSize: 14, lineHeight: 1.6 },
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
